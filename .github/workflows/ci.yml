name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  context:
    name: change-context
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.context.outputs.base }}
      head: ${{ steps.context.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: context
        name: Resolve explicit comparison commits
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pr = event.get('pull_request')
          head = pr['head']['sha'] if pr else os.environ['GITHUB_SHA']
          base = pr['base']['sha'] if pr else event.get('before', '')
          if not base or set(base) == {'0'}:
              result = subprocess.run(['git', 'rev-parse', f'{head}^'], capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit('No previous commit is available; establish a reviewed baseline first')
              base = result.stdout.strip()
          for ref in [base, head]:
              subprocess.run(['git', 'rev-parse', '--verify', f'{ref}^{{commit}}'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'base={base}\nhead={head}\n')
          PY

  regression:
    name: regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,web]'
      - name: Run every test with Python socket access disabled
        # No provider secrets are exposed to pull-request code. Credential-dependent
        # tests may skip; this is not evidence of successful live API verification.
        run: python -m pytest -q --disable-socket --allow-unix-socket --junitxml="${RUNNER_TEMP}/regression.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/regression.xml
          retention-days: 14

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,web]'
      - name: Lint
        if: always()
        run: python -m ruff check .
      - name: Type check the complete application source
        if: always()
        run: python -m mypy src
      - name: Check dependency consistency
        if: always()
        run: python -m pip check
      - name: Audit installed dependencies
        if: always()
        run: python -m test.ci_gates dependencies

  architecture-security:
    name: architecture-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,web]'
      - name: Layout, dependency direction, and permission boundaries
        run: python -m test.ci_gates structure
      - name: Security analysis of all source paths
        if: always()
        run: python -m bandit -r src -ll
      - name: Deterministic API, safety, and prompt contracts
        if: always()
        run: >-
          python -m pytest -q --disable-socket --allow-unix-socket
          test/offline/test_ci_gates.py test/offline/test_cli_commands.py
          test/offline/test_portfolio_context.py test/offline/test_rating_integrity.py
          test/offline/test_tool_date_enforcement.py test/offline/test_prompt_integrity.py
          test/offline/test_structured_agent_prompts.py

  requirements:
    name: requirements-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m test.ci_gates schema

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/tradingagents_web/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/tradingagents_web/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  frontend-e2e:
    name: frontend-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/tradingagents_web/frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev,web]'
      - run: npm ci
        working-directory: src/tradingagents_web/frontend
      - run: npm run build
        working-directory: src/tradingagents_web/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: src/tradingagents_web/frontend
      - run: npm run e2e
        working-directory: src/tradingagents_web/frontend

  review-and-log:
    name: review-and-ai-log
    needs: context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Require meaningful new AI-use records for changed code and prompts
        env:
          BASE_SHA: ${{ needs.context.outputs.base }}
          HEAD_SHA: ${{ needs.context.outputs.head }}
        run: python -m test.ci_gates ai-log --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Verify prior test approval with the base-owned checker
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.context.outputs.base }}
          HEAD_SHA: ${{ needs.context.outputs.head }}
        run: |
          python -I - <<'PY'
          import ast, json, os, re, subprocess, sys, tempfile
          from pathlib import Path
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          root = Path(os.environ['GITHUB_WORKSPACE'])
          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          if not all(re.fullmatch(r'[0-9a-f]{40}', ref) for ref in (base, head)):
              raise SystemExit('Invalid comparison commits')
          def read(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}'], cwd=root, text=True)
          policy = tomllib.loads(read(base, 'pyproject.toml')).get('tool', {}).get('tradingagents', {}).get('ci', {})
          source = base
          if 'test_approval' not in policy:
              if base != 'ac47e1f07bcf13508be83b4f6276afc80cc449a5':
                  raise SystemExit('Missing protected-base test approval policy')
              source = head
          code = read(source, 'test/ci_gates.py')
          parsed = ast.parse(code)
          supported = any(isinstance(node, ast.Assign) and any(isinstance(target, ast.Name)
              and target.id == 'TEST_APPROVAL_POLICY_VERSION' for target in node.targets)
              and isinstance(node.value, ast.Constant) and node.value.value == 1 for node in parsed.body)
          if not supported:
              raise SystemExit('Missing supported protected test approval checker')
          with tempfile.TemporaryDirectory(prefix='test-approval-checker-') as temporary:
              trusted = Path(temporary)
              for name in ('test/__init__.py', 'test/ci_gates.py', 'scripts/validate/validate_requirements.py'):
                  target = trusted / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(read(source, name))
              for name in ('scripts/__init__.py', 'scripts/validate/__init__.py'):
                  (trusted / name).write_text('')
              launcher = ('import runpy,sys; sys.path.insert(0,sys.argv[1]); '
                          'sys.argv=["ci_gates", "approval", "--repo-root", sys.argv[2], '
                          '"--base", sys.argv[3], "--head", sys.argv[4]]; '
                          'runpy.run_module("test.ci_gates",run_name="__main__")')
              result = subprocess.run([sys.executable, '-I', '-c', launcher, str(trusted), str(root), base, head], cwd=trusted)
              raise SystemExit(result.returncode)
          PY

  semantic-evaluation:
    name: semantic-evaluation
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Replay fixed semantic evaluation with the protected-base checker
        env:
          BASE_SHA: ${{ needs.context.outputs.base }}
          HEAD_SHA: ${{ needs.context.outputs.head }}
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          # Protected-base equivalent of python -m test.ci_gates semantic.
          python -I - <<'PY'
          import os, re, subprocess, sys, tempfile
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          if not all(re.fullmatch(r'[0-9a-f]{40}', ref) for ref in (base, head)):
              raise SystemExit('Invalid semantic comparison commits')
          def read(path):
              return subprocess.check_output(['git', 'show', f'{base}:{path}'], cwd=root, text=True)
          with tempfile.TemporaryDirectory(prefix='semantic-checker-') as temporary:
              trusted = Path(temporary)
              for name in ('test/__init__.py', 'test/ci_gates.py', 'scripts/validate/validate_requirements.py'):
                  target = trusted / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(read(name))
              for name in ('scripts/__init__.py', 'scripts/validate/__init__.py'):
                  (trusted / name).write_text('')
              launcher = ('import sys,tomllib; from pathlib import Path; '
                  'sys.path.insert(0,sys.argv[1]); from test.ci_gates import check_semantic,semantic_needed,blob; '
                  'root=Path(sys.argv[2]); base,head=sys.argv[3:5]; '
                  'policy=tomllib.loads(blob(root,base,"pyproject.toml")).get("tool",{}).get("tradingagents",{}).get("ci",{}).get("semantic_evaluation",{}); '
                  'required=semantic_needed(root,base,head); '
                  'sys.exit("Missing protected-base semantic policy") if required and not policy else None; '
                  'executed=check_semantic(root,base,head); '
                  'print("PASS: semantic" if executed else "Semantic evaluation: NOT REQUIRED")')
              result = subprocess.run([sys.executable, '-I', '-c', launcher, str(trusted), str(root), base, head], cwd=trusted)
              raise SystemExit(result.returncode)
          PY

  smoke-install:
    name: clean-install-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Import and verify packaged CLI resources outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib.resources
          import tradingagents
          import cli.main
          assert importlib.resources.files('cli').joinpath('static/welcome.txt').is_file()
          print('Clean-install imports and packaged CLI resource verified')
          PY
          tradingagents --help

  blocking-gate:
    # Push/manual runs cannot satisfy the merge gate or overwrite a PR verdict.
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && 'blocking-gate' || 'branch-checks' }}
    if: always()
    needs: [context, regression, static-analysis, architecture-security, requirements, frontend, frontend-e2e, review-and-log, semantic-evaluation, smoke-install, governance-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed, cancelled, or skipped prerequisites
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          checks = json.loads(os.environ['NEEDS_JSON'])
          blocked = {name: item['result'] for name, item in checks.items() if item['result'] != 'success'}
          if blocked:
              raise SystemExit(f'Blocking prerequisites: {blocked}')
          print('All blocking prerequisites succeeded')
          PY

  governance-validation:
    name: governance documentation/schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation deps (jsonschema for real schema, PyYAML for YAML)
        run: pip install jsonschema pyyaml
      - name: Validate required artifacts, YAML/JSONC, real schema, and secrets
        run: python scripts/validate/validate_requirements.py
