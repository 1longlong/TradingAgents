name: CI

on:
  push:
    branches:
      - main
      - feature/token-observability
      - fix/cs5351-final-submission
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Deterministic offline tests: a placeholder endpoint (never contacted by
      # the dry-run tests) and no live provider key. Real credentials are never
      # placed in CI.
      TRADINGAGENTS_LLM_BACKEND_URL: https://ci.invalid/v1
      DEEPSEEK_API_KEY: ""
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run offline test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (submission files)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.17.1"
      - name: Lint the files this submission adds or changes
        # Scope: the Python files added or changed by the CS5351 submission.
        # The repository has a pre-existing ruff baseline (233 findings at
        # 50b2ca3 under ruff 0.17.1: 40 product, 88 tests, 105 evidence
        # scripts). Cleaning it would require product-code changes that this
        # course-deliverable round forbids; it is tracked as DEBT-010 in
        # docs/debt-register.md rather than hidden here.
        run: |
          ruff check \
            scripts/validate \
            tests/test_submission_compliance.py \
            tests/test_cand01_batch_16run_v3_infra.py \
            tests/test_cli_prefs.py

  course-compliance:
    name: course compliance (offline validator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyyaml>=6" "jsonschema>=4"
      - name: Validate the course submission (offline)
        # Enforces the real requirements schema and every required artifact.
        # This job is offline: no secrets, no network beyond pip, no LLM calls.
        run: python scripts/validate/validate_submission.py
