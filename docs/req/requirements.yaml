    owner: 60536848-WANG-Yiwen

  - id: FR-DQG-006
    type: Feature
    category: invariant-zero-tolerance
    title: Authoritative blocked verdict at the output boundary
    description: >
      A blocked Data Quality Gate verdict must remain authoritative through the
      downstream stored recommendations and the final signal/report. A single
      deterministic, LLM-free output guard reads the gate state fail-closed
      (missing/malformed/inconsistent -> blocked) and pins the executable
      decision field (Recommendation / Rating / Action) to Hold on blocked runs,
      for both structured and free-text output, plus every repeated decision
      header and every Final Transaction Proposal marker; it never rewrites
      arbitrary rationale prose. On a blocked Trader output, executable
      entry/stop/position-sizing values are neutralised (a documented narrow
      rule) while the quoted rationale is preserved. A degraded (not blocked) run
      additionally enforces a deterministic confidence ceiling (ADR-011 Stage 4,
      approved 0.60 engineering ceiling) on explicit confidence-labelled numerics
      across the debate, managers, trader, portfolio decision, every post-gate
      model prompt read, the saved report and the memory log; it is not applied to
      a blocked run (which keeps its non-numeric Hold discipline) and is not a
      calibrated probability or production threshold tuning.
    priority: Must
    priority_rationale: "See product.priorities for the rationale; Must-level because a violation is a safety/correctness veto."
    tradeoff:
      decision: "Pin decision fields to Hold, preserve rationale."
      rejected_or_deferred: "Rewrite entire report neutral."
      why: "Full rewrite destroys auditability."
    origin: user-design
    fit_criterion:
      metric: "Blocked-run outputs whose parsed/plain final signal is not Hold (structured or free-text)."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "blocked-signal escape regressions"
      verification:
        method: "Output-guard tests incl. full graph and fullwidth/long/proposal formats."
        command: ".venv/bin/python -m pytest tests/test_output_guard.py -q"
        references:
          - "tests/test_output_guard.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "130 passed, includes stored-plan + saved-report cases (logbook 067); awaits human review."
    status: Implemented
    source_files:
      - tradingagents/agents/utils/output_guard.py
      - tradingagents/agents/utils/rating.py
      - tradingagents/agents/managers/research_manager.py
      - tradingagents/agents/managers/portfolio_manager.py
      - tradingagents/agents/trader/trader.py
      - tradingagents/graph/signal_processing.py
      - tradingagents/agents/utils/memory.py
    design_artifacts:
      - docs/architecture/adr/001-data-quality-gate.md
      - docs/architecture/invariants.md
    tests:
      - tests/test_output_guard.py
      - tests/test_research_manager_hold_contract.py
      - tests/test_structured_agents.py
      - tests/test_memory_log.py
    verification_evidence:
      - "tests/test_output_guard.py + hold-contract/structured/memory-log: 184 passed; independent-review demo yields final_signal Hold (logbook 058/059)."
      - "2026-11-06 review findings 1 and 3 fix: the guard now recognizes the same decision-header grammar the rating extractor reads (fullwidth colon, prefixed labels such as 'Final rating', unicode dashes, repeated/trailing alternative labels) and preserves the semantic whitespace separator so 'Rating: Buy because ...' pins to 'Rating: Hold because ...' rather than 'Holdbecause'. The final signal boundary is also gate-aware: SignalProcessor.process_signal(text, state) returns Hold on a blocked run, and the memory log records Hold for a blocked run."
      - "2026-11-06 operator executable-instruction maintenance: decision recognition is a single shared linear scan (rating.decision_header/_split_header: NFKC-first, arbitrary plain descriptor with no cap, required separator, single-word value; blockquote/narrative mentions excluded). It pins fullwidth/NFKC labels and values, long descriptors ('My final ... recommendation rating: Buy'), repeated/trailing labels, Markdown wrapping, and executable 'FINAL TRANSACTION PROPOSAL: BUY because ...' markers to '**<Label>**: Hold' while preserving the explanation; a blocked Trader's fullwidth entry/stop/position-sizing fields neutralise to 'not applicable' with the rationale kept. Quoted/narrative alternatives survive and no longer override the decision because extract_rating takes the last structural header as authoritative before its looser fallback, so the plain textual signal, report decision and memory body agree. tests/test_output_guard.py: 130 passed; focused affected suite 520 passed; strict offline suite 4 failed / 1661 passed (same known baselines; not all-green; logbook 067)."
    owner: 60536848-WANG-Yiwen

  # ---- Dynamic debate termination (FR-DDT-*) ----
