  - id: NFR-001
    title: Token observability and measured accounting
    type: non-functional
    priority: Must
    description: >-
      Every provider call shall be observable at the event level with separate
      input, output, cached and reasoning token counts, the provider's raw usage
      blob, call order and attribution. The harness shall account for retries,
      preserve failed attempts, reject negative counts, avoid double counting a
      duplicate callback delivery, and report run totals that equal the sum of
      per-call events. Two real batches were measured: V2 used 7 attempts
      (5 valid, 1 environment-failed, 1 invalid) for 1,463,791 tokens; V3 used
      18 attempts over 16 Run IDs (15 valid, 1 environment-failed, 2 invalid)
      for 3,067,669 tokens. Combined: 25 attempts, 20 valid, 4,531,460 tokens
      (4,112,224 valid, 419,236 failed).
    acceptance_criteria:
      - id: AC-NFR-001-01
        statement: >-
          Each LLM event records input, output, cached and reasoning token
          counts separately, with an absent field left null rather than zero.
        verification: tests/test_observability.py
      - id: AC-NFR-001-02
        statement: >-
          A run's totals equal the sum of its own LLM events, and a duplicate
          on_llm_end delivery for the same run id is counted once.
        verification: tests/test_observability.py
      - id: AC-NFR-001-03
        statement: >-
          The benchmark harness preserves failed attempts, validates
          input+output equals total per run, and refuses to publish an average
          over fewer valid runs than requested.
        verification: tests/test_token_benchmark.py
    implementation:
      - tradingagents/observability.py
      - scripts/token_benchmark.py
      - scripts/run_token_benchmark.sh
    tests:
      - tests/test_observability.py
      - tests/test_token_benchmark.py
      - tests/test_run_token_benchmark_sh.py
      - tests/test_graph_tool_observability.py
    status: implemented
    evidence:
      - token_benchmarks/README.md
      - token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/TEST_RESULTS.md
      - token_benchmarks/live_pilot_2x2/cand01_batch_16run_v3/TEST_RESULTS.md
      - token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/logs/mutation_final_freeze.txt

  - id: NFR-002
    title: Experiment reproducibility and freeze
    type: non-functional
    priority: Must
    description: >-
      A measured experiment shall be reproducible from a frozen tree. The
      freeze record, annotated tag, HEAD, tree fingerprint, release seal,
      per-file manifest and all 16 run config hashes shall bind to the same
      commit; specs shall regenerate deterministically; and a run whose tree or
      spec drifts from the registration shall be refused before any paid call.
      The lineage is upstream base 2d17df8 (2026-09-17), branch created
      2026-10-20, rc1 9948bf8 (2026-11-12, tag rc1), V2 freeze 15270b1 (tag
      c3-final-freeze), V3 freeze e3b5cca (tag c3-v3-final-freeze), and final
      50b2ca3 (tag cand01-v3-final-remediation, pushed to
      origin/feature/token-observability), with 68 commits from rc1 to final
      and 0 merges.
    acceptance_criteria:
      - id: AC-NFR-002-01
        statement: >-
          HEAD, the freeze record and the annotated tag must name the same
          commit, and the working-tree fingerprint must match the registered
          value or the verifier fails.
        verification: tests/test_c3_final_freeze.py
      - id: AC-NFR-002-02
        statement: >-
          Every manifest entry and release-seal digest verifies, and all 16 V3
          config hashes match the registered specs.
        verification: tests/test_cand01_batch_16run_v3_infra.py
      - id: AC-NFR-002-03
        statement: >-
          Every registered V3 spec verifies against its registration hash, and
          a spec or registration that drifts is refused before a paid call.
        verification: tests/test_c3_regressions.py
      - id: AC-NFR-002-04
        statement: >-
          The V3 generator --check reproduces the delivered artefacts in its
          generating checkout; the two path-sensitive V3 infra tests that fail
          in a differently rooted worktree are documented known failures, not a
          green reproducibility claim.
        verification: token_benchmarks/live_pilot_2x2/cand01_batch_16run_v3/RUN_READINESS.md
    implementation:
      - scripts/c3_finalize_freeze.py
      - scripts/c3_verify_final_freeze.py
      - scripts/c3_build_manifest.py
      - scripts/c3_preflight_gate.py
      - scripts/gen_cand01_batch_16run_specs_v3.py
    tests:
