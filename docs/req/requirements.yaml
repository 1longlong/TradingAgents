- id: NFR-CMP-003
  type: governance
  title: Human traceability rubric and honest scripted-result labeling
  statement: 'Human traceability uses a documented rubric with human-entered per-dimension scores in [0,
    1]; an unscored case stays pending with None scores rather than fabricating a rating. A SCORED traceability
    result requires exactly four non-null scores, one for each TRACEABILITY_DIMENSIONS dimension, in that
    exact positional order; a missing, extra, null, duplicate, or reordered dimension set fails closed
    rather than silently mis-reporting a rating. The Phase 4A comparison output and reports must be labeled
    clearly as deterministic offline scripted-fixture results, not live-provider measurements, and must
    state that no production thresholds were tuned and that human score-based traceability is pending
    a human.

    '
  priority: should
  priority_tradeoff: 'See product.priorities for the rationale; Should-level because impact is bounded
    but quality-relevant. Decision: Pending stays pending; human-only scores. Rejected/deferred: Auto-estimate
    traceability. Reason: An AI score would be fabricated.'
