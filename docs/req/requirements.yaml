- id: FR-DQG-002
  type: invariant
  title: Fail-closed gate verdict precedence
  statement: 'The gate must rank decisions blocked > degraded > normal, convert any
    internal exception into a blocked decision, and never silently return normal on
    missing evidence or error.

    '
  priority: must
  priority_tradeoff: 'See product.priorities for the rationale; Must-level because
    a violation is a safety/correctness veto. Decision: Tiered blocked>degraded>normal
    with exception->blocked. Rejected/deferred: Binary pass/fail abort. Reason: Binary
    blocks tolerable degraded runs (DQG-ALT-4).'
  priority_rationale: See product.priorities for the rationale; Must-level because
    a violation is a safety/correctness veto.
  tradeoff:
