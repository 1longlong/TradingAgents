  - id: REQ-WEB-010
    type: functional
    statement: >-
      The WebUI shall provide read-only history over existing run directories,
      saved report trees, backtest runs, and the decision memory, without
      creating a new index or mutating any artifact.
    priority: must
    priority_tradeoff: >-
      A read-only projection adds discoverability without expanding storage or
      retention scope. A new index database would be faster but would become a
      second source of truth and require a separate storage approval.
    origin: extension
    sources:
