    look-ahead, cross-source consistency) and emits a GateDecision before the Bull/Bear
    debate opens.

    '
  priority: must
  priority_tradeoff: 'See product.priorities for the rationale; Must-level because
    a violation is a safety/correctness veto. Decision: Deterministic LLM-free gate.
