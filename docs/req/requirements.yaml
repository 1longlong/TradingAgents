- id: FR-OBS-005
  type: cost
  title: Telemetry selection integrity across repeated attempts
  statement: 'When an attempt is restarted, select exactly one telemetry artifact
    for the measured attempt by a rule fixed before the run starts, never silently
    preferring the larger or the newer file, and preserve every superseded artifact
    as evidence rather than overwriting it. Cross-run aggregation keeps failed attempts
    and never reports a missing value as zero.

    '
  priority: must
  priority_tradeoff: Preferring a file after the fact is hindsight selection and inflates
    the reported sample.
  priority_rationale: Aggregation that double-counts a retry or drops a failed attempt
    misreports the experiment.
  tradeoff:
    decision: Preserve every attempt and apply a selection rule fixed before the run.
    rejected_or_deferred: Prefer the newest or largest telemetry file.
    why: Preferring a file after the fact is hindsight selection and inflates the
      reported sample.
