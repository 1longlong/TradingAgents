  - id: NFR-003
    title: API credential protection
    type: non-functional
    priority: Must
    description: >-
      Provider and data-vendor credentials shall never be printed, logged,
      committed or written into an experiment artefact. The benchmark wrapper
      shall parse its secrets file as plain KEY=VALUE data without sourcing it,
      map only the two CityU Foundry variables, honour an explicitly exported
      variable first, and keep the secret out of argv. A saved key file shall be
      readable only by its owner.
    acceptance_criteria:
      - id: AC-NFR-003-01
        statement: >-
          Every selectable LLM provider resolves to a documented environment
          variable and Ollama requires no key.
        verification: tests/test_api_key_env.py
      - id: AC-NFR-003-02
        statement: >-
          A saved key file is written with owner-only permissions, and an
          unknown provider never triggers an interactive key prompt.
        verification: tests/test_api_key_env.py
      - id: AC-NFR-003-03
        statement: >-
          The benchmark wrapper reads only the named secrets file, never
          sources it, passes it as data, and prints no secret value.
        verification: tests/test_run_token_benchmark_sh.py
    implementation:
      - tradingagents/llm_clients/api_key_env.py
      - cli/utils.py
      - scripts/run_token_benchmark.sh
      - .env.example
    tests:
      - tests/test_api_key_env.py
      - tests/test_google_api_key.py
      - tests/test_cli_env_skip.py
      - tests/test_env_overrides.py
    status: implemented
    evidence:
      - token_benchmarks/live_pilot_2x2/cand01_batch_16run_v3/c3/env_credential_audit.txt
