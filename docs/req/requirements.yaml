    priority_rationale: "See product.priorities for the rationale; Must-level because a violation is a safety/correctness veto."
    tradeoff:
      decision: "Deterministic evaluate_round ordering."
      rejected_or_deferred: "LLM-judged end-of-debate."
      why: "LLM judged end is non-deterministic (DDT-ALT-2)."
    origin: user-design
    fit_criterion:
      metric: "Nondeterministic evaluator decisions across identical inputs (shuffled/clock-varying)."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "evaluator determinism/ordering failures"
      verification:
