  - id: FR-OBS-004
    type: Feature
    category: cost
    title: Invocation-level settlement of Single-Pass attempts
    description: >
      Instrument every actual Single-Pass model invocation at the transport
      boundary so that N outbound attempts produce exactly N invocation records,
      with no nested or double settlement, provider usage preserved when it is
      available, and a missing usage field left missing rather than set to zero.
      A budget denial propagates without issuing an unauthorised fallback
      request.
    priority: Must
    priority_rationale: "An unaccounted call voids the sample; the bound is zero-tolerance."
    tradeoff:
      decision: "Settle usage from the raw transport response at the single billed boundary."
      rejected_or_deferred: "Estimating usage from the parsed object or from rendered text."
      why: "The parsed object is lossy and text estimation invents counts the provider never reported."
    origin: user-design
    retrospective_origin:
      classification: retrospective
      rationale: "Recorded after Single-Pass accounting was unified at the transport boundary; this row names the invariant the merged code enforces."
