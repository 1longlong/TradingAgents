  - id: FR-DDT-005
    type: Feature
    category: invariant-zero-tolerance
    title: Deterministic ConflictRecord runtime lifecycle
    description: >
      A pure, LLM-free conflict tracker (tradingagents/debate/conflicts.py) must
      create, observe (deduplicate/merge), resolve, and escalate ConflictRecord
      objects deriving conflicts ONLY from the structured conflict_assertions a
      DebateTurn carries (parsed by turn.py from the DEBATE_METADATA conflict_a
      marker). Stable deterministic conflict IDs derive from (normalized topic,
      kind). Evidence validation fails closed: an assert citing an unknown, Low,
      or future evidence ID never creates a conflict, and a re-observation that
      cites such an ID drops the otherwise-open conflict (never kept on
      unverifiable footing). Empty evidence on a new factual/interpretive
      conflict does not create it; a turn with no assertions (missing metadata)
      contributes no conflict. Action-only disagreement is tracked (so the
      Research Manager can weigh it) but never blocks debate termination. A
      resolve/escalate closes or promotes an open conflict and records the
      human-readable reason; resolving a non-open conflict is a no-op (no second
      misleading reason). Malformed assertions/under-defined state are skipped,
      never guessed. The evaluator node persists the derived conflicts and a
      safe, structured, prose-free ConflictSummary (with the resolve/escalate
      resolution notes and an authoritative open-blocking count) to the debate
      state, and the Research Manager injects that summary safely (empty when no
      tracked conflict, so a bare action-only divergence is not presented as a
      fabricated disagreement).
    priority: Must
    priority_rationale: "See product.priorities for the rationale; Must-level because a violation is a safety/correctness veto."
    tradeoff:
      decision: "Conflicts only from structured assertions."
      rejected_or_deferred: "Prose/CoT-derived conflicts."
      why: "Prose conflicts are fabricated."
    origin: user-design
    fit_criterion:
      metric: "Conflict records derived from prose, or created/kept on unverifiable evidence."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "conflict-lifecycle safety failures"
      verification:
        method: "Conflict tracker tests."
        command: ".venv/bin/python -m pytest tests/test_debate_conflicts.py tests/test_debate_turn.py tests/test_exact_claim_runtime.py -q"
        references:
