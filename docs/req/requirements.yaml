  - id: FR-HAR-002
    type: Feature
    category: governance
    title: Experiment reproducibility bound to one frozen commit
    description: >
      A measured experiment is reproducible from a frozen tree: the freeze
      record, annotated tag, HEAD, tree fingerprint, release seal, per-file
      manifest and every run config hash bind to the same commit. Specs
      regenerate deterministically, and a run whose tree or spec drifts from the
      registration is refused before any paid call.
    priority: Must
    priority_rationale: "An experiment that cannot be re-derived from a frozen tree is not reproducible."
    tradeoff:
      decision: "Bind freeze record, tag, HEAD, tree fingerprint, manifest and per-run hashes to one commit."
      rejected_or_deferred: "Trusting the working tree at run time."
      why: "A drifting tree makes two runs incomparable and lets an untested change enter the measurement."
    origin: user-design
    retrospective_origin:
