    fit_criterion:
      metric: "Count of failing campaign-mechanics assertions (an arm delivery is proven and a reverted round leaves no accepted change) in the named offline test file."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "failing assertions in tests/test_ablation_switches.py"
      verification:
        method: "Run the named offline test file; a nonzero failure count is a criterion violation. The campaign's measured numbers are NOT re-derived here."
        command: ".venv/bin/python -m pytest tests/test_ablation_switches.py -q"
        references:
          - "tests/test_ablation_switches.py"
      applicability: offline-test
      status:
