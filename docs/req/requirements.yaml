product:
  stakeholders:
  - name: Student author (WANG Yiwen, 60536848)
    interest: Complete the CS5351 project honestly under deterministic, offline-verifiable governance.
  - name: CS5351 course instructors
    interest: Assess requirements→design→build→verify traceability, governance, and honest evidence.
  - name: Downstream maintainers of this fork
    interest: A safe, fail-closed, backward-compatible extension of the upstream TradingAgents graph.
  - name: Human operator / reviewer
    interest: Retain authority over safety-critical, git, network, and scope decisions.
  problem_statement: "An LLM multi-agent trading pipeline can open a Bull/Bear debate on stale, missing,\
    \ or low-quality market evidence and can run a fixed number of rounds regardless of whether evidence\
    \ is still changing. This risks directional recommendations built on unverified data and wasted token/time\
    \ budget. The project adds a deterministic Data Quality Gate that can stop the debate before it opens,\
    \ and a deterministic evidence-aware termination evaluator that ends the debate when it is no longer\
    \ productive — both fail-closed, offline-testable, and backward-compatible.\n The WebUI extends this\
    \ same core with local, single-user analysis, progress, reporting, history and backtest presentation;\
    \ it does not replace core validation or add trading execution."
  goals:
  - Fail closed on missing/low-quality evidence before a directional debate.
  - Terminate the debate on evidence-aware, budget-safe, deterministic rules.
  - Keep all new logic pure, deterministic, and offline-testable (no network/LLM).
  - Preserve legacy fixed-round behavior when the new feature is disabled.
  - Make every decision auditable (reason codes, policy version, evidence IDs, trace).
  - Expose the existing analysis, reporting, recovery and backtest capabilities through a local single-user
    WebUI.
  non_goals:
  - Improving first-party forecasting accuracy or alpha claims.
  - Live-provider benchmarking or production threshold tuning (Phase 4B).
  - Adding unrequested data vendors, LLM providers or UI features.
  - Duplicating the established src/test trees or making unrelated source-layout changes.
  scope:
    in_scope:
    - Deterministic Data Quality Gate (FR-DQG-001..006).
    - Dynamic debate termination + conflict lifecycle (FR-DDT-001..005).
    - Non-functional guarantees (NFR-DET/FC/PIT/AUD/BUD/BC/OFF/SEC-001).
    - Phase 4A deterministic offline baseline comparison (NFR-CMP-001..003).
    - An eight-step analysis parameter wizard equivalent to the CLI, with server-side API-key status in
      place of interactive key entry.
    - Live run progress, messages, tool calls, current report, and footer statistics equivalent to the
      CLI live view.
    - Checkpoint controls, portfolio JSON input, cancellation, and a single active run.
    - Completion summary, the complete I-V report, fixed-directory persistence, and browser downloads.
    - Read-only history over existing artifacts, without a new database or retention policy.
    - Backtest launch and result views equivalent to the CLI backtest command.
    - Chinese/English interface switching.
    - Local loopback deployment without authentication for one user.
    out_of_scope:
    - Phase 4B live-provider benchmarking (requires separate human authorization).
    - Production threshold tuning (requires separate human authorization).
    - Trading execution, order placement, or position changes.
    - New data sources, model providers, agents, prompts, or rating rules.
    - Multi-user, multi-tenant, billing, or authentication.
    - New databases, message queues, cloud deployment, or container orchestration.
    - PDF or Word export, and native mobile applications.
    - Multi-ticker batch analysis outside the existing backtest capability.
    - Cross-run comparison, scoring dashboards, or backtest charts.
    - Unrequested changes to CLI/core semantics beyond importing the approved release capabilities.
  success_criteria:
  - id: SUCCESS-001
    statement: A blocked gate never yields a directional final signal (Hold enforced downstream).
    classification: measured
  - id: SUCCESS-002
    statement: Every new gate/evaluator output is deterministic and JSON-safe.
    classification: measured
  - id: SUCCESS-003
    statement: The debate never exhausts budget mid-round without its summary reserve.
    classification: measured
  - id: SUCCESS-004
    statement: Disabled config reproduces legacy fixed-round routing.
    classification: measured
  - id: SUCCESS-005
    statement: Default pytest -q stays offline (no network / no paid LLM).
    classification: measured
  - id: SUCCESS-006
    statement: Live end-to-end school-model run would reduce mean tokens/time vs the fixed-round baseline
      across a benchmark set.
    classification: target
  - id: SUCCESS-007
    statement: Human-entered traceability scores would reach a rubric-defined threshold.
    classification: target
  constraints:
  - All prompts, comments, commits, and reviews in English.
  - No secrets in committed files; no network/paid API in the default test run.
  - No commit/push/PR, live benchmark, or production tuning without explicit human approval.
  - Preserve all pre-existing user-authored changes; minimal, scoped diffs.
  priorities:
  - requirement_id: FR-DQG-001
    priority: must
    rationale: The gate is the primary safety mechanism; without it the debate can run on unverified data.
  - requirement_id: FR-DQG-002
    priority: must
    rationale: Fail-closed precedence is a zero-tolerance safety property.
  - requirement_id: FR-DQG-003
    priority: should
    rationale: Determinism of IDs/serialization supports reproducibility but is not itself a safety veto.
  - requirement_id: FR-DQG-004
    priority: must
    rationale: Multi-category evaluation is what makes the gate meaningful at runtime.
  - requirement_id: FR-DQG-005
    priority: must
    rationale: Auditable, redacted artifacts are required for any trustworthy review.
  - requirement_id: FR-DQG-006
    priority: must
    rationale: A blocked verdict must survive to the final output or the gate is cosmetic.
  - requirement_id: FR-DDT-001
    priority: must
    rationale: Evidence-aware termination is the second requested improvement and is safety-relevant.
  - requirement_id: FR-DDT-002
    priority: must
    rationale: Citation allowlisting prevents fabricated-evidence-driven continuation.
  - requirement_id: FR-DDT-003
    priority: must
    rationale: Budget safety guarantees a report is always produced.
  - requirement_id: FR-DDT-004
    priority: should
    rationale: Backward compatibility protects existing users but is not a security hazard if violated
      only at the edge.
  - requirement_id: FR-DDT-005
    priority: must
    rationale: Conflict lifecycle must be derived structurally and fail closed; otherwise conflicts are
      fabricated.
  - requirement_id: NFR-DET-001
    priority: must
    rationale: Determinism is a zero-tolerance property for a gate/evaluator used in decisions.
  - requirement_id: NFR-FC-001
    priority: must
    rationale: Fail-closed is the core safety invariant of the project.
  - requirement_id: NFR-PIT-001
    priority: must
    rationale: Look-ahead leakage corrupts any decision; inherited invariant preserved.
  - requirement_id: NFR-AUD-001
    priority: must
    rationale: Auditability is required to verify any other claim.
  - requirement_id: NFR-BUD-001
    priority: must
    rationale: Budget exhaustion without a report is a hard failure.
  - requirement_id: NFR-BC-001
    priority: should
    rationale: Compatibility matters for adoption but is lower severity than a safety breach.
  - requirement_id: NFR-OFF-001
    priority: must
    rationale: Offline testability is a governance mandate (no network in default tests).
  - requirement_id: NFR-SEC-001
    priority: must
    rationale: Secret leakage is a zero-tolerance security property.
  - requirement_id: NFR-CMP-001
    priority: must
    rationale: The Phase 4A comparison is the approved evidence vehicle; it must be honest and fail-closed.
  - requirement_id: NFR-CMP-002
    priority: must
    rationale: Measured vs estimated must never be conflated, or the comparison misleads.
  - requirement_id: NFR-CMP-003
    priority: should
    rationale: Honest labeling/traceability is important for integrity but is a presentation-layer property.
  - requirement_id: REQ-WEB-001
    priority: must
    rationale: A complete wizard is the only way to guarantee that every analysis input visible in the
      CLI is also visible in the WebUI. The cost is a longer form; prefill, environment detection, and
      clear defaults mitigate it. Skipping a step would hide a decision that changes analysis behavior.
  - requirement_id: REQ-WEB-002
    priority: must
    rationale: Live visibility is the core interactive value of the existing TUI. Without it, a long analysis
      becomes an opaque request. The cost is an event pipeline and buffering; a bounded buffer keeps memory
      predictable.
  - requirement_id: REQ-WEB-003
    priority: must
    rationale: Checkpointing is the existing recovery mechanism for long runs. Exposing it is required
      for parity; the cost is careful destructive-action confirmation. Omitting it would make crash recovery
      CLI-only.
  - requirement_id: REQ-WEB-004
    priority: must
    rationale: Portfolio context changes how the trader, risk analysts, and portfolio manager size a decision.
      Accepting it through the browser is required for CLI parity; the input must not become a server-path
      capability.
  - requirement_id: REQ-WEB-005
    priority: must
    rationale: Long analyses need a stop control, and a stop that silently records a decision would corrupt
      the memory log. The cost is a cancellation state machine and explicit partial-artifact handling.
  - requirement_id: REQ-WEB-006
    priority: must
    rationale: The core uses a global configuration singleton and a read-modify-write decision log. A
      single active run is the smallest safe synchronization mechanism. The cost is no parallel analyses;
      that is an accepted scope boundary for this iteration.
  - requirement_id: REQ-WEB-007
    priority: must
    rationale: Analyses can run for minutes. Tying them to a browser tab would waste provider spend. The
      cost is an in-memory event buffer and a snapshot path; cross-process recovery is deliberately excluded
      to avoid new storage.
  - requirement_id: REQ-WEB-008
    priority: must
    rationale: The report is the primary artifact of a run. The completion state, REVIEW warning, and
      wall times are the difference between a usable result and an opaque one. The cost is report rendering
      and section mapping.
  - requirement_id: REQ-WEB-009
    priority: must
    rationale: Reusing the existing layout keeps CLI and web artifacts interchangeable. Replacing it would
      create two report formats. The cost is server-side packaging for downloads and strict identifier
      validation.
  - requirement_id: REQ-WEB-010
    priority: must
    rationale: A read-only projection adds discoverability without expanding storage or retention scope.
      A new index database would be faster but would become a second source of truth and require a separate
      storage approval.
  - requirement_id: REQ-WEB-011
    priority: must
    rationale: The backtest is an existing evaluation capability, so exposing it is parity rather than
      a new feature. The cost is another long-running task shape and careful isolation from the live decision
      log.
  - requirement_id: REQ-WEB-012
    priority: must
    rationale: Announcements are part of the existing CLI startup experience and were explicitly retained.
      The cost is an external request and a blocking modal; failure remains silent and must never prevent
      a run.
  - requirement_id: REQ-WEB-013
    priority: must
    rationale: Accepting keys in the browser would transmit plaintext credentials into a client surface.
      Server environment variables are the only approved source. The cost is that the web UI cannot complete
      the CLI's interactive key prompt; that deviation is explicit.
  - requirement_id: REQ-WEB-014
    priority: must
    rationale: The user explicitly selected bilingual UI. Report language remains a separate existing
      setting, so the two must not be conflated. The cost is a message catalogue and a completeness test.
  - requirement_id: REQ-WEB-020
    priority: must
    rationale: The confirmed deployment is a single local user. No authentication is acceptable only because
      the listener is loopback-only and same-origin checks compensate. Binding broadly without authentication
      would expose analysis runs and artifacts to the local network.
  - requirement_id: REQ-WEB-021
    priority: should
    rationale: Desktop modern browsers cover the confirmed users. Adding mobile or legacy-browser support
      would expand layout and testing scope without a confirmed user. The cost is a documented and tested
      browser matrix.
  - requirement_id: REQ-WEB-022
    priority: should
    rationale: The TUI refreshes at 4 fps, so one second is a reasonable upper bound for a local presentation
      layer. A tighter target would add buffering and transport complexity without a confirmed need. This
      threshold is proposed and needs human approval.
  - requirement_id: REQ-WEB-023
    priority: must
    rationale: A leak would expose paid provider credentials and violate the project's safety boundary.
      Redaction and allowlisted serialization add work but are non-negotiable.
  - requirement_id: REQ-WEB-024
    priority: must
    rationale: Server paths in the browser would expose the host layout and invite path traversal. Identifiers
      add an indirection layer but keep the boundary deterministic.
  - requirement_id: REQ-WEB-025
    priority: must
    rationale: Model and external text are untrusted. Rich rendering improves reading but must not create
      script execution or link-based exfiltration. The cost is a sanitizer and a rendering contract.
  - requirement_id: REQ-WEB-026
    priority: must
    rationale: The confirmed scope is a new presentation layer, not a refactor. Keeping the core and CLI
      untouched preserves every existing consumer and makes regression attribution unambiguous.
  - requirement_id: REQ-WEB-027
    priority: must
    rationale: Every added capability would expand the safety and verification surface beyond the approved
      presentation scope. Display parity is sufficient.
  - requirement_id: REQ-WEB-028
    priority: must
    rationale: These are baseline safety semantics. Relaxing either would change how a decision is interpreted,
      which is outside the presentation scope.
  - requirement_id: REQ-WEB-029
    priority: must
    rationale: The baseline memory writer and global configuration are not proven safe under concurrency.
      A single active run and explicit cancellation semantics are the minimum safe boundary.
  - requirement_id: REQ-WEB-030
    priority: must
    rationale: Mixing logs would contaminate the live decision context. Mutating history would turn a
      read model into an unapproved storage feature.
  - requirement_id: REQ-WEB-031
    priority: must
    rationale: This is a baseline safety boundary. Displaying richer content is allowed; granting it authority
      is not.
  tradeoffs:
  - requirement_id: FR-DQG-001
    decision: Deterministic LLM-free gate.
    rejected_or_deferred: LLM-based quality judge.
    why: LLM judging is non-deterministic, costly, and unauditable offline (see option-ledger DQG-ALT-1).
  - requirement_id: FR-DQG-002
    decision: Tiered blocked>degraded>normal, exception→blocked.
    rejected_or_deferred: Binary pass/fail that aborts on any low quality.
    why: Binary would block runs a human tolerates; tiering preserves fail-closed safety with a degraded
      path.
  - requirement_id: FR-DQG-004
    decision: Optional categories can degrade but never block; market category always blocks if missing.
    rejected_or_deferred: Treat every category as equally critical.
    why: Only the market snapshot is a trustworthy structured source today; inventing parity would fabricate
      criticality.
  - requirement_id: FR-DQG-006
    decision: Pin decision fields to Hold; preserve rationale as prose.
    rejected_or_deferred: Rewrite the whole report to a neutral essay.
    why: Rewriting destroys auditability; pinning the executable field is the minimal safe intervention.
  - requirement_id: FR-DDT-001
    decision: Deterministic evaluate_round rule ordering.
    rejected_or_deferred: LLM-judged 'is the debate over?'.
    why: LLM judging is non-deterministic and cannot be regression-tested offline.
  - requirement_id: FR-DDT-002
    decision: Structured DEBATE_METADATA with best-effort prose fallback that never extends the debate.
    rejected_or_deferred: Opportunistic prose parsing that can extend/shorten the debate arbitrarily.
    why: A missed marker must never silently add a round or fabricate evidence.
  - requirement_id: FR-DDT-003
    decision: Explicit summary reserve + hard max tokens/time/calls + pre-call admission guard.
    rejected_or_deferred: Wall-clock-only control with no reserve.
    why: Without a reserve a run can exhaust budget mid-debate and lose its report.
  - requirement_id: FR-DDT-004
    decision: enabled=False reproduces legacy routing.
    rejected_or_deferred: Default to dynamic unconditionally (upstream-breaking).
    why: Compatibility keeps the upstream contract and default test run stable.
  - requirement_id: FR-DDT-005
    decision: Conflicts only from structured assertions; unverifiable evidence drops the conflict.
    rejected_or_deferred: Derive conflicts from prose/chain-of-thought.
    why: Prose-derived conflicts are fabricated and unverifiable.
  - requirement_id: NFR-PIT-001
    decision: As-of boundary on every dated path.
    rejected_or_deferred: Trust vendor 'latest' data without an as-of cut.
    why: Look-ahead leakage corrupts decisions; this is an inherited invariant.
  - requirement_id: NFR-BUD-001
    decision: Reserve summary budget and refuse overcalls before dispatch.
    rejected_or_deferred: Best-effort accounting that lets one extra call slip through.
    why: A guaranteed report outweighs one extra debate hop.
  - requirement_id: NFR-OFF-001
    decision: Default pytest -q is offline; live tests are opt-in integration.
    rejected_or_deferred: Always run vendor/LLM calls in CI.
    why: Network/paid calls are non-deterministic, costly, and unauthorized by default.
  - requirement_id: NFR-CMP-003
    decision: Unscored traceability stays pending (None); never fabricate a score.
    rejected_or_deferred: Auto-estimate a traceability score.
    why: Only a human may enter rubric scores; an AI-estimated score would be fabricated.
  measured_vs_targets:
    measured:
    - Blocked-gate final signal is Hold (offline regression, test/offline/test_output_guard.py).
    - Determinism/JSON-safety of gate + evaluator (offline tests).
    - Pre-call budget guard blocks over-budget calls (offline tests, test/offline/test_debate_precall_budget.py).
    - enabled=False reproduces legacy routing (offline tests, test/offline/test_debate_config.py).
    - Default pytest -q needs no network (offline suite; live tests integration-marked).
    - Phase 4A scripted-fixture comparison (offline) — labelled scripted, not live.
    targets:
    - Live mean token/time reduction vs fixed-round baseline over a benchmark set (NOT measured; Phase
      4B, requires authorization).
    - Human traceability scores reaching a rubric threshold (NOT entered; pending a human).
    - Production threshold values (NOT tuned; prohibited pending authorization).
    note: 'Measured items are backed by the referenced offline commands/tests. Targets are aspirations
      only and must never be reported as achieved. Estimated token/time savings shown in scripted fixtures
      are estimates, not live performance promises.

      '
  deferred_scope:
  - item: Phase 4B live-provider benchmarking.
    classification: deferred (blocked on authorization)
    rationale: Requires separate explicit human authorization; not started, not measured.
  - item: Production threshold tuning.
    classification: deferred (blocked on authorization)
    rationale: Prohibited without separate explicit human authorization; no threshold invented.
  historical_scope:
  - item: Phase 4B live-provider benchmarking.
    classification: deferred (blocked on authorization)
    rationale: Requires separate explicit human authorization; not started, not measured.
  - item: Production threshold tuning.
    classification: deferred (blocked on authorization)
    rationale: Prohibited without separate explicit human authorization; no threshold invented.
  - item: Degraded-run numeric confidence ceiling (DEBT-014).
    classification: deferred (blocked on authorization)
    rationale: A ceiling must be specified by policy before enforcement; not invented here. (Stage 3 of
      the 2026-11-11 approved four-item plan; NOT yet implemented.)
  - item: Live latency/token accounting basis for debate budget (DEBT-021/RISK-021).
    classification: deferred (blocked on authorization)
    rationale: The 2026-11-06 live finding is reproduced and recorded but NOT fixed (source unchanged);
      requires an authorized implementation round.
  - item: Claim-date semantic validation of cited evidence (DEBT-022/RISK-020).
    classification: deferred (blocked on authorization)
    rationale: The 2026-11-06 live finding is recorded but NOT fixed; an allowlist checks eligibility,
      not claim-date truth.
  - item: Relocating or duplicating the source tree into src/ or test/.
    classification: won't (out of scope)
    rationale: Inherited layout is mapped via README pointers; the mapping remains an upstream-layout
      exception pending instructor agreement.
