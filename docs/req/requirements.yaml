- id: REQ-WEB-007
  type: functional
  statement: The WebUI shall continue an active run when the browser disconnects and allow the browser
    to reattach within the lifetime of the server process; after a process restart the active run is not
    recovered.
  priority: must
  priority_tradeoff: Analyses can run for minutes. Tying them to a browser tab would waste provider spend.
    The cost is an in-memory event buffer and a snapshot path; cross-process recovery is deliberately
    excluded to avoid new storage.
