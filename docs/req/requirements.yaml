- id: FR-ANL-005
  type: cost
  title: Single-pass structured report finalisation
  statement: 'When the CAND-01 single-pass switch is enabled, an analyst emits its
    structured report on the call that would otherwise have written the prose report,
    instead of writing prose and paying a second call to regenerate the same analysis.
    The schema is bound beside the data tools, the tool loop is preserved, and every
    failure path falls back to the pre-change behaviour without leaking protocol markup
    into the report.

    '
  priority: should
  priority_tradeoff: The second call re-pays for analysis already performed; binding
    in place keeps one billed boundary.
  priority_rationale: Single-pass removes a redundant paid call but the system remains
    correct without it.
  tradeoff:
    decision: Bind the report schema beside the data tools on the existing call.
    rejected_or_deferred: A second prose-regeneration call after the tool loop.
    why: The second call re-pays for analysis already performed; binding in place
