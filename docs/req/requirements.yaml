    with documented zero-denominator behavior (returns None, never raises or fabricates). Measured provider-reported
    values are separated from deterministic char-based estimates via an explicit estimated flag; evidence-citation
    coverage is derived from valid cited evidence IDs (known, High/Medium, on-or-before target, linked
    to a claim) over the snapshot''s eligible IDs; false-strong-conclusion rate is computed from an explicit
    strong_conclusion flag plus the gate/quality outcome, never inferred from prose; and aggregate sums/rates
    must be derived deterministically and reproducible across runs. Tool-call counts (per case and aggregate)
