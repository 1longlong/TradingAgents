  # ---- Verification of record (NFR-VER-*) ----
  # Added by the D1 integration (2026-11-21) for personal NFR-004 and NFR-005.
  # No existing Release requirement states these obligations: NFR-OFF-001
  # governs network isolation of the test run, not whether the verification was
  # executed or independently audited.
  - id: NFR-VER-001
    type: NonFunctional
    category: governance
    title: Executed offline test suite and independent audit
    description: >
      The delivered code is verified by an executable offline test suite and by
      independent read-only audits rather than by assertion. The recorded suite
      at the token-observability commit 50b2ca3 reported 2,227 passed, 4 known
      failed, 2 skipped and 319 subtests, and a .env-free run of the same
      deliverable reported 2,233 passed, 0 failed, 2 skipped and 319 subtests;
      three independent audits reported PASS. A known failure is named with its
      cause and is never removed by weakening an assertion, and a numeric
      result quoted from a session report is labelled as a session self-report
      until it is re-run.
    priority: Must
    priority_rationale: "A delivery whose only evidence is prose cannot be audited; the suite and the independent audits are the verification of record."
    tradeoff:
      decision: "Quote the recorded suite and audit results with their known failures, and label anything not re-run."
      rejected_or_deferred: "Reporting a green suite while known failures remain, or dropping a failing assertion to obtain green."
      why: "A green claim that hides a known failure is worse than a named failure, because it removes the signal a reviewer needs."
    origin: governance
    retrospective_origin:
      classification: retrospective
      rationale: "The suite and the three independent audits were delivered before this row existed; it records that verification-of-record obligation after the fact."
      source_requirement_ids:
        - "NFR-004"
    fit_criterion:
      metric: "Count of new product-test failures introduced in the merged worktree by the documentation integration."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "new product-test failures"
      verification:
        method: "Run the D1-scoped offline checks and, once the unrelated merge conflicts are resolved, the recorded full suite; compare against the recorded baseline rather than asserting a fresh green run. The full suite is NOT_RUN in this worktree while D2-D9 conflicts remain."
        command: ".venv/bin/python -m pytest tests -q"
        references:
          - "token_benchmarks/final_remediation_20261116/TEST_RESULTS.md"
          - "token_benchmarks/final_remediation_20261116/INDEPENDENT_AUDIT.md"
          - "tests/test_submission_compliance.py"
      applicability: governance
      status:
        state: partially_verified
        evidence: "The recorded suite counts and the three PASS audits are quoted from the delivered evidence (token_benchmarks/final_remediation_20261116/). The full suite was NOT re-run in this worktree because D2-D9 conflicts are still unmerged, so no merged-tree green claim is made. D1-scoped checks are reported in docs/ai-use-session-audit.md."
    status: Implemented
    source_files:
      - tests/test_final_remediation.py
      - tests/test_c3_final_freeze.py
      - tests/test_c3_regressions.py
      - tests/test_audit_a_regressions.py
      - tests/test_audit_b_regressions.py
      - tests/test_audit_c_regressions.py
    design_artifacts:
      - token_benchmarks/final_remediation_20261116/TEST_RESULTS.md
      - token_benchmarks/final_remediation_20261116/INDEPENDENT_AUDIT.md
      - docs/ai-use-session-audit.md
    tests:
      - tests/test_final_remediation.py
      - tests/test_c3_final_freeze.py
      - tests/test_submission_compliance.py
    verification_evidence:
      - "Recorded suite at 50b2ca3: 2,227 passed / 4 known failed / 2 skipped / 319 subtests; .env-free run: 2,233 passed / 0 failed / 2 skipped / 319 subtests (token_benchmarks/final_remediation_20261116/TEST_RESULTS.md)."
      - "Three independent audits report PASS (token_benchmarks/final_remediation_20261116/INDEPENDENT_AUDIT.md)."
