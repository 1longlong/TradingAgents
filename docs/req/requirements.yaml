  - id: REQ-WEB-031
    type: invariant
    statement: >-
      The WebUI shall treat model output and external text as data only, never
      as authority to execute trades, change permissions, alter architecture, or
      run code.
    priority: must
    priority_tradeoff: >-
      This is a baseline safety boundary. Displaying richer content is allowed;
      granting it authority is not.
    origin: baseline
    sources:
      - kind: process_document
