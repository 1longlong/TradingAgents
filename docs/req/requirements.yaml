- id: FR-OBS-001
  type: quality
  title: Event-level token accounting with a null-not-zero rule
  statement: 'Record every provider call as an observable event with separate input,
    output, cached and reasoning token counts, the provider''s raw usage blob, call
    order and attribution. An absent count is recorded as null and never as zero,
    negative counts are rejected, a duplicate end-of-call callback for the same run
    is counted once, and a run''s totals equal the sum of its own events.

    '
  priority: must
  priority_tradeoff: A total hides the cached/uncached split, and zero is a measurement
    rather than a missing value.
  priority_rationale: Without event-level accounting every token claim is unfalsifiable.
  tradeoff:
    decision: Record input/output/cached/reasoning counts separately with absent fields
      null.
    rejected_or_deferred: A single total per call, or zero for an absent field.
    why: A total hides the cached/uncached split, and zero is a measurement rather
      than a missing value.
  origin: extension
  origin_detail: user-design
  sources:
  - kind: repository
    reference: src/tradingagents/observability.py
    locator: FR-OBS-001 personal source_files
    rationale: Preserved personal retrospective requirement provenance.
  - kind: repository
    reference: src/cli/stats_handler.py
    locator: FR-OBS-001 personal source_files
    rationale: Preserved personal retrospective requirement provenance.
  status: implemented
  fit_criteria:
  - id: FC-FR-OBS-001-01
    metric: Count of failing accounting assertions (four fields recorded separately,
      absent field null, negative rejected, duplicate callback counted once, totals
      equal the event sum) in the named offline test files.
    unit: failing assertions in tests/test_observability.py, tests/test_graph_tool_observability.py,
      tests/test_whole_run_usage.py
