        evidence: "39 passed (logbook 046). Stage 3 (ADR-010): a factual conflict on a valid ID whose typed exact claim did not validate is not created/drops an open one (tests/test_exact_claim_runtime.py::TestConflictLifecycle; logbook 081)."
    status: Implemented
    source_files:
