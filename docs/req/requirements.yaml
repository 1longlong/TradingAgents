- id: FR-HAR-003
  type: cost
  title: Fail-closed spend contract for authorised paid runs
  statement: 'A paid measurement run may spend only under an explicit budget contract.
    A null token cap means unlimited ONLY when the registration explicitly declares
    budget_mode uncapped_authorized. A missing protocol file, a malformed budget block,
    a missing or invalid mode and a non-integer cap are each distinct refusals rather
    than defaults, and an unreadable or unknown spend figure is reported as unknown
    rather than as zero. Reserved tokens count toward a real cap, and a run whose
    budget contract cannot be verified is refused before the first paid call.

    '
  priority: must
  priority_tradeoff: A default-to-unlimited fallback is an unauthorised spend path,
    so the only safe default is refusal.
  priority_rationale: An unverified budget contract can authorise unbounded paid spend;
    this is a cost-safety veto and a separate enforcement point from the debate-level
    summary reserve.
  tradeoff:
    decision: Every paid run is admitted through an explicit, mode-declared budget
      contract.
    rejected_or_deferred: Treating a null cap or an unreadable budget file as unlimited.
    why: A default-to-unlimited fallback is an unauthorised spend path, so the only
      safe default is refusal.
  origin: extension
  origin_detail: user-design
  sources:
