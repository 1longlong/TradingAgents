# TradingAgents WebUI requirements registry.
# Status: draft for human review. No requirement is approved or implemented.
# Sources of truth: AGENTS.md, Prompt.md, docs/code-governance/*, and the
# confirmed requirements discussion of 2026-11-05.
schema_version: '1.0'
project:
  name: TradingAgents WebUI
  purpose: >-
    Add a local, single-user, single-active-run web presentation layer over the
    existing TradingAgents analysis, reporting, memory, checkpoint, and backtest
    capabilities without changing the core or CLI behavior.
  baseline_ref: release
  baseline_commit: 2d17df8da1536c121e4d7395ac5a5dcec9e96d6f
  scope:
    - >-
      An eight-step analysis parameter wizard equivalent to the CLI, with
      server-side API-key status in place of interactive key entry.
    - >-
      Live run progress, messages, tool calls, current report, and footer
      statistics equivalent to the CLI live view.
    - >-
      Checkpoint controls, portfolio JSON input, cancellation, and a single
      active run.
    - >-
      Completion summary, the complete I-V report, fixed-directory persistence,
      and browser downloads.
    - >-
      Read-only history over existing artifacts, without a new database or
      retention policy.
    - >-
      Backtest launch and result views equivalent to the CLI backtest command.
    - Chinese/English interface switching.
    - Local loopback deployment without authentication for one user.
  out_of_scope:
    - Trading execution, order placement, or position changes.
    - New data sources, model providers, agents, prompts, or rating rules.
    - Multi-user, multi-tenant, billing, or authentication.
    - New databases, message queues, cloud deployment, or container orchestration.
    - PDF or Word export, and native mobile applications.
    - Multi-ticker batch analysis outside the existing backtest capability.
    - Cross-run comparison, scoring dashboards, or backtest charts.
    - Changes to CLI arguments, defaults, output, exit codes, or core behavior.

requirements:
  - id: REQ-WEB-001
    type: functional
    statement: >-
      The WebUI shall expose the complete eight-step analysis selection flow:
      ticker, analysis date, output language, analyst selection, research depth,
      LLM provider and endpoint, quick/deep models with provider thinking
      parameters, and last-run preferences, with server-side API-key status in
      place of interactive key entry.
    priority: must
    priority_tradeoff: >-
      A complete wizard is the only way to guarantee that every analysis input
      visible in the CLI is also visible in the WebUI. The cost is a longer form;
      prefill, environment detection, and clear defaults mitigate it. Skipping a
      step would hide a decision that changes analysis behavior.
    origin: extension
    sources:
      - kind: human_decision
        reference: Requirements discussion in the current session, 2026-11-05
        locator: Batches 1-4 and final confirmation
        rationale: The user confirmed a complete eight-step wizard aligned with the TUI.
      - kind: repository
        reference: src/cli/main.py
        locator: _prompt_selections(), get_user_selections(), _build_run_config()
        rationale: Defines the current eight-step selection flow and configuration assembly.
      - kind: repository
        reference: src/cli/utils.py
        locator: get_ticker(), get_analysis_date(), select_analysts(), select_research_depth(), select_llm_provider(), _select_model()
        rationale: Defines the validation, provider, model, and language choices to expose.
    status: draft
    architecture_refs:
      - architecture-blueprint.md#w1-entry-and-parameter-surface
      - architecture-blueprint.md#run-request
    invariant_refs:
      - INV-WEB-005
    owner: webui
    depends_on: []
    fit_criteria:
      - id: FC-WEB-001-01
        metric: wizard_steps_rendered
        unit: steps
        comparison: eq
        threshold: 8
        verification:
          method: pytest
          mode: offline
