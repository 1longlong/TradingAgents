  - id: REQ-WEB-013
    type: security
    statement: >-
      The WebUI shall not accept, persist, or return provider keys; it shall
      display only configured/not-configured status and shall allow a run to
      start when a key is missing, failing at the first provider call as the CLI
      does.
    priority: must
    priority_tradeoff: >-
