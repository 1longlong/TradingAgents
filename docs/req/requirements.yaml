- id: FR-DQG-004
  type: functional
  title: Multi-category data-quality gate engine
  statement: 'Extend the gate to evaluate exactly one critical market group plus the optional categories
    (fundamentals, news, sentiment). Optional categories without a trustworthy structured source produce
    an explicit deterministic unavailable/insufficient result with stable reason codes (fabrication of
    source/date/unit and analyst-prose parsing are prohibited); under a versioned multi-category policy
    they may degrade the verdict but never block, while a missing/blocked market category always fails
    closed to blocked. Output is JSON-safe and deterministic (run_id from (trade_date, normalized symbol)).

    '
  priority: must
  priority_tradeoff: 'See product.priorities for the rationale; Must-level because a violation is a safety/correctness
    veto. Decision: Optional categories degrade, never block; market blocks if missing. Rejected/deferred:
