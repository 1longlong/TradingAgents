      decision: "Structured DEBATE_METADATA + safe fallback."
      rejected_or_deferred: "Opportunistic prose parsing."
      why: "Prose can extend/shorten debate arbitrarily (DDT-ALT-3)."
    origin: user-design
    fit_criterion:
