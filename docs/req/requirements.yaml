      - docs/architecture/runtime-policy-catalog.md
    tests:
      - tests/test_debate_budget.py
      - tests/test_debate_precall_budget.py
      - tests/test_durable_usage_ledger.py
      - tests/test_whole_run_usage.py
    verification_evidence:
      - "Stage-2 relevant suite: 402 passed (current tree)."
      - "Pre-call guard prevents over-budget optional calls and preserves the summary reserve; the token/time check includes the estimated next-call cost, not only the reserve (logbook 060/063)."
      - "2026-11-11 Stage 2 (ADR-009): a durable run-scoped SQLite ledger reserves spend before every outbound call and settles after, so a failed/billed attempt survives a crash and resume reconciles idempotently; unresolved/unknown spend makes optional calls fail closed; the summary reserve is protected per attempt without a second optional estimate; admission re-reads and enforces the full policy inside a BEGIN IMMEDIATE transaction. tests/test_durable_usage_ledger.py 33 passed + tests/test_whole_run_usage.py 10 passed; full strict-offline 1940 passed / 0 sockets (logbook 080). Offline-only; a reservation is an estimate, not a physical billing bound (DEBT-036)."
