# Retrospective requirements baseline for the CS5351 TradingAgents submission.
#
# These requirements were written after the project was delivered, by reading
# the committed code, tests, experiment records and audit reports. They are a
# retrospective baseline: they do NOT claim that a requirements document or
# these identifiers existed before the project, and they do not assert any
# human approval that is not evidenced in the repository.
#
# Every implementation and test path below exists in this worktree. Numeric
# claims are restricted to the canonical project facts recorded in the project
# block and in docs/ai-use-log.yaml. Requirements are intentionally stated as
# verifiable capabilities, not as claims of investment performance.
schema_version: "1.0"

project:
  name: TradingAgents
  description: >-
    Multi-agent LLM equity-analysis system. Analysts cover market, news and
    fundamentals; researchers debate bull and bear cases; a research manager,
    trader, risk debaters and portfolio manager produce a single investment
    decision for a ticker on a point-in-time trade date. The delivered study
    measures token consumption and engineering correctness, not investment
    returns.
