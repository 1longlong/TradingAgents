      - tests/test_comparison_runner.py
    verification_evidence:
      - "tests/test_comparison_schemas.py + tests/test_comparison_runner.py: 90 passed (correction round 73 logbook 054; narrow fail-closed correction 90 logbook 055)."
      - "evaluation-output/comparison_results.json + comparison_report.md include Total tool calls, per-case Tool calls/Source, Estimated (not measured) cases, and the actual stop reason per case and in the stop-reason aggregate."
      - "Narrow fail-closed correction: early_stop_rate / the early-stop label can never be produced for a contradictory strategy/early_stopped/stop_reason combination (logbook 055)."
      - "Human review decision: Phase 4A approved with limitations (WANG Yiwen 60536848, 2026-10-23; logbook 056; docs/review-memo.md)."
    owner: 60536848-WANG-Yiwen

  - id: NFR-CMP-003
    type: NonFunctional
    title: Human traceability rubric and honest scripted-result labeling
    description: >
      Human traceability uses a documented rubric with human-entered
      per-dimension scores in [0, 1]; an unscored case stays pending with None
      scores rather than fabricating a rating. A SCORED traceability result
      requires exactly four non-null scores, one for each
      TRACEABILITY_DIMENSIONS dimension, in that exact positional order; a
      missing, extra, null, duplicate, or reordered dimension set fails closed
      rather than silently mis-reporting a rating. The Phase 4A comparison output and
      reports must be labeled clearly as deterministic offline scripted-fixture
      results, not live-provider measurements, and must state that no production
      thresholds were tuned and that human score-based traceability is pending a
      human.
    priority: Should
    status: Implemented
    source_files:
      - tradingagents/comparison/schemas.py
      - tradingagents/comparison/report.py
      - tradingagents/comparison/runner.py
    design_artifacts:
      - docs/architecture/adr/003-phase4a-offline-comparison.md
    tests:
