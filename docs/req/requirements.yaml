      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "failing assertions in tests/test_merge_integration.py"
      verification:
        method: "Run the named offline test file; a nonzero failure count is a criterion violation."
        command: ".venv/bin/python -m pytest tests/test_merge_integration.py -q"
        references:
          - "tests/test_merge_integration.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "The named file passes offline with a scripted transport that reports provider usage; no provider is contacted."
    status: Implemented
    source_files:
