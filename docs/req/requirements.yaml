# CS5351 project requirements (machine-readable PRD + requirement registry).
# Validated against docs/req/req-schema.json by scripts/validate/validate_requirements.py.
# Stable IDs are reused in docs/architecture/trace-matrix.md. Do not reuse or
# reassign IDs out of band. The schema is backward compatible with the original
# v1.0 registry: all 22 IDs, the Feature/NonFunctional `type` values, the
# Must/Should/Could priorities, and the schema_version / ID patterns are
# preserved. This revision ADDS (a) a product/PRD block (stakeholders, problem,
# goals/non-goals, scope, success, constraints, priorities, tradeoffs) and
# (b) a per-requirement structured `fit_criterion`, `priority_rationale`,
# `tradeoff`, and `origin`. Measured results are kept distinct from targets.
#
# NOTE: Numeric thresholds below are either (i) the existing configured budget
# assertions already enforced in code/tests, or (ii) measurable ZERO-TOLERANCE
# safety targets (exactly 0 defects/violations). No approved production
# performance threshold is invented. Estimated token/time savings are NOT
# promised as live performance.
#
# CATEGORIES: each requirement carries a `category` (functional,
# invariant-zero-tolerance, quality, performance, cost, governance, security).
# Six of the seven are populated by genuine requirements. `performance` has NO
# genuine requirement because no production performance threshold has been
# approved or measured (Phase 4B is unauthorized); it is intentionally absent
# rather than filled with a fabricated performance target.
#
# The schema validates the fit_criterion CHECK CONTRACT (metric/operator/
# threshold_type/threshold/unit/verification/applicability/status and the
# type-consistency conditionals). Validating the schema does NOT run the
# verification assertions and therefore does NOT prove runtime semantics.

project:
  name: "TradingAgents downstream fork — deterministic Data Quality Gate and dynamic debate termination"
  branch: "feature/data-quality-debate-control"
  deliverable_slide_sources:
    - "src/"
    - "test/offline/"
    - "test/live/"
  canonical_source_trees:
    - "tradingagents/"
    - "cli/"
  schema_version: "v1.1"

product:
  stakeholders:
    - name: "Student author (WANG Yiwen, 60536848)"
      interest: "Complete the CS5351 project honestly under deterministic, offline-verifiable governance."
    - name: "CS5351 course instructors"
      interest: "Assess requirements→design→build→verify traceability, governance, and honest evidence."
    - name: "Downstream maintainers of this fork"
      interest: "A safe, fail-closed, backward-compatible extension of the upstream TradingAgents graph."
    - name: "Human operator / reviewer"
      interest: "Retain authority over safety-critical, git, network, and scope decisions."
  problem_statement: >
    An LLM multi-agent trading pipeline can open a Bull/Bear debate on stale,
    missing, or low-quality market evidence and can run a fixed number of rounds
    regardless of whether evidence is still changing. This risks directional
    recommendations built on unverified data and wasted token/time budget. The
    project adds a deterministic Data Quality Gate that can stop the debate
    before it opens, and a deterministic evidence-aware termination evaluator
    that ends the debate when it is no longer productive — both fail-closed,
    offline-testable, and backward-compatible.
  goals:
    - "Fail closed on missing/low-quality evidence before a directional debate."
    - "Terminate the debate on evidence-aware, budget-safe, deterministic rules."
    - "Keep all new logic pure, deterministic, and offline-testable (no network/LLM)."
    - "Preserve legacy fixed-round behavior when the new feature is disabled."
    - "Make every decision auditable (reason codes, policy version, evidence IDs, trace)."
  non_goals:
    - "Improving first-party forecasting accuracy or alpha claims."
    - "Live-provider benchmarking or production threshold tuning (Phase 4B)."
    - "Adding new data vendors, LLM providers, or UI features."
    - "Relocating or duplicating the inherited source tree."
  scope:
    in_scope:
      - "Deterministic Data Quality Gate (FR-DQG-001..006)."
      - "Dynamic debate termination + conflict lifecycle (FR-DDT-001..005)."
      - "Non-functional guarantees (NFR-DET/FC/PIT/AUD/BUD/BC/OFF/SEC-001)."
      - "Phase 4A deterministic offline baseline comparison (NFR-CMP-001..003)."
    out_of_scope:
      - "Phase 4B live-provider benchmarking (requires separate human authorization)."
      - "Production threshold tuning (requires separate human authorization)."
      - "Unrequested features, new vendors/providers, source-tree relocation."
  success_criteria:
    - id: SUCCESS-001
      statement: "A blocked gate never yields a directional final signal (Hold enforced downstream)."
      classification: measured
    - id: SUCCESS-002
      statement: "Every new gate/evaluator output is deterministic and JSON-safe."
      classification: measured
    - id: SUCCESS-003
      statement: "The debate never exhausts budget mid-round without its summary reserve."
      classification: measured
    - id: SUCCESS-004
      statement: "Disabled config reproduces legacy fixed-round routing."
      classification: measured
    - id: SUCCESS-005
      statement: "Default pytest -q stays offline (no network / no paid LLM)."
      classification: measured
    - id: SUCCESS-006
      statement: "Live end-to-end school-model run would reduce mean tokens/time vs the fixed-round baseline across a benchmark set."
      classification: target
    - id: SUCCESS-007
      statement: "Human-entered traceability scores would reach a rubric-defined threshold."
      classification: target
  constraints:
    - "All prompts, comments, commits, and reviews in English."
    - "No secrets in committed files; no network/paid API in the default test run."
    - "No commit/push/PR, live benchmark, or production tuning without explicit human approval."
    - "Preserve all pre-existing user-authored changes; minimal, scoped diffs."
  priorities:
    - requirement_id: FR-DQG-001
      priority: Must
      rationale: "The gate is the primary safety mechanism; without it the debate can run on unverified data."
    - requirement_id: FR-DQG-002
      priority: Must
      rationale: "Fail-closed precedence is a zero-tolerance safety property."
    - requirement_id: FR-DQG-003
      priority: Should
      rationale: "Determinism of IDs/serialization supports reproducibility but is not itself a safety veto."
    - requirement_id: FR-DQG-004
      priority: Must
      rationale: "Multi-category evaluation is what makes the gate meaningful at runtime."
    - requirement_id: FR-DQG-005
      priority: Must
      rationale: "Auditable, redacted artifacts are required for any trustworthy review."
    - requirement_id: FR-DQG-006
      priority: Must
      rationale: "A blocked verdict must survive to the final output or the gate is cosmetic."
    - requirement_id: FR-DDT-001
      priority: Must
      rationale: "Evidence-aware termination is the second requested improvement and is safety-relevant."
    - requirement_id: FR-DDT-002
      priority: Must
      rationale: "Citation allowlisting prevents fabricated-evidence-driven continuation."
    - requirement_id: FR-DDT-003
      priority: Must
      rationale: "Budget safety guarantees a report is always produced."
    - requirement_id: FR-DDT-004
      priority: Should
      rationale: "Backward compatibility protects existing users but is not a security hazard if violated only at the edge."
    - requirement_id: FR-DDT-005
      priority: Must
      rationale: "Conflict lifecycle must be derived structurally and fail closed; otherwise conflicts are fabricated."
    - requirement_id: NFR-DET-001
      priority: Must
      rationale: "Determinism is a zero-tolerance property for a gate/evaluator used in decisions."
    - requirement_id: NFR-FC-001
      priority: Must
      rationale: "Fail-closed is the core safety invariant of the project."
    - requirement_id: NFR-PIT-001
      priority: Must
      rationale: "Look-ahead leakage corrupts any decision; inherited invariant preserved."
    - requirement_id: NFR-AUD-001
      priority: Must
      rationale: "Auditability is required to verify any other claim."
    - requirement_id: NFR-BUD-001
      priority: Must
      rationale: "Budget exhaustion without a report is a hard failure."
    - requirement_id: NFR-BC-001
      priority: Should
      rationale: "Compatibility matters for adoption but is lower severity than a safety breach."
    - requirement_id: NFR-OFF-001
      priority: Must
      rationale: "Offline testability is a governance mandate (no network in default tests)."
    - requirement_id: NFR-SEC-001
      priority: Must
      rationale: "Secret leakage is a zero-tolerance security property."
    - requirement_id: NFR-CMP-001
      priority: Must
      rationale: "The Phase 4A comparison is the approved evidence vehicle; it must be honest and fail-closed."
    - requirement_id: NFR-CMP-002
      priority: Must
      rationale: "Measured vs estimated must never be conflated, or the comparison misleads."
    - requirement_id: NFR-CMP-003
      priority: Should
      rationale: "Honest labeling/traceability is important for integrity but is a presentation-layer property."
  tradeoffs:
    - requirement_id: FR-DQG-001
      decision: "Deterministic LLM-free gate."
      rejected_or_deferred: "LLM-based quality judge."
      why: "LLM judging is non-deterministic, costly, and unauditable offline (see option-ledger DQG-ALT-1)."
    - requirement_id: FR-DQG-002
      decision: "Tiered blocked>degraded>normal, exception→blocked."
      rejected_or_deferred: "Binary pass/fail that aborts on any low quality."
      why: "Binary would block runs a human tolerates; tiering preserves fail-closed safety with a degraded path."
    - requirement_id: FR-DQG-004
      decision: "Optional categories can degrade but never block; market category always blocks if missing."
      rejected_or_deferred: "Treat every category as equally critical."
      why: "Only the market snapshot is a trustworthy structured source today; inventing parity would fabricate criticality."
    - requirement_id: FR-DQG-006
      decision: "Pin decision fields to Hold; preserve rationale as prose."
      rejected_or_deferred: "Rewrite the whole report to a neutral essay."
      why: "Rewriting destroys auditability; pinning the executable field is the minimal safe intervention."
    - requirement_id: FR-DDT-001
      decision: "Deterministic evaluate_round rule ordering."
      rejected_or_deferred: "LLM-judged 'is the debate over?'."
      why: "LLM judging is non-deterministic and cannot be regression-tested offline."
    - requirement_id: FR-DDT-002
      decision: "Structured DEBATE_METADATA with best-effort prose fallback that never extends the debate."
      rejected_or_deferred: "Opportunistic prose parsing that can extend/shorten the debate arbitrarily."
      why: "A missed marker must never silently add a round or fabricate evidence."
    - requirement_id: FR-DDT-003
      decision: "Explicit summary reserve + hard max tokens/time/calls + pre-call admission guard."
      rejected_or_deferred: "Wall-clock-only control with no reserve."
      why: "Without a reserve a run can exhaust budget mid-debate and lose its report."
    - requirement_id: FR-DDT-004
      decision: "enabled=False reproduces legacy routing."
      rejected_or_deferred: "Default to dynamic unconditionally (upstream-breaking)."
      why: "Compatibility keeps the upstream contract and default test run stable."
    - requirement_id: FR-DDT-005
      decision: "Conflicts only from structured assertions; unverifiable evidence drops the conflict."
      rejected_or_deferred: "Derive conflicts from prose/chain-of-thought."
      why: "Prose-derived conflicts are fabricated and unverifiable."
    - requirement_id: NFR-PIT-001
      decision: "As-of boundary on every dated path."
      rejected_or_deferred: "Trust vendor 'latest' data without an as-of cut."
      why: "Look-ahead leakage corrupts decisions; this is an inherited invariant."
    - requirement_id: NFR-BUD-001
      decision: "Reserve summary budget and refuse overcalls before dispatch."
      rejected_or_deferred: "Best-effort accounting that lets one extra call slip through."
      why: "A guaranteed report outweighs one extra debate hop."
    - requirement_id: NFR-OFF-001
      decision: "Default pytest -q is offline; live tests are opt-in integration."
      rejected_or_deferred: "Always run vendor/LLM calls in CI."
      why: "Network/paid calls are non-deterministic, costly, and unauthorized by default."
    - requirement_id: NFR-CMP-003
      decision: "Unscored traceability stays pending (None); never fabricate a score."
      rejected_or_deferred: "Auto-estimate a traceability score."
      why: "Only a human may enter rubric scores; an AI-estimated score would be fabricated."
  measured_vs_targets:
    measured:
      - "Blocked-gate final signal is Hold (offline regression, tests/test_output_guard.py)."
      - "Determinism/JSON-safety of gate + evaluator (offline tests)."
      - "Pre-call budget guard blocks over-budget calls (offline tests, tests/test_debate_precall_budget.py)."
      - "enabled=False reproduces legacy routing (offline tests, tests/test_debate_config.py)."
      - "Default pytest -q needs no network (offline suite; live tests integration-marked)."
      - "Phase 4A scripted-fixture comparison (offline) — labelled scripted, not live."
    targets:
      - "Live mean token/time reduction vs fixed-round baseline over a benchmark set (NOT measured; Phase 4B, requires authorization)."
      - "Human traceability scores reaching a rubric threshold (NOT entered; pending a human)."
      - "Production threshold values (NOT tuned; prohibited pending authorization)."
    note: >
      Measured items are backed by the referenced offline commands/tests. Targets
      are aspirations only and must never be reported as achieved. Estimated
      token/time savings shown in scripted fixtures are estimates, not live
      performance promises.
  deferred_scope:
    - item: "Phase 4B live-provider benchmarking."
      classification: "deferred (blocked on authorization)"
      rationale: "Requires separate explicit human authorization; not started, not measured."
    - item: "Production threshold tuning."
      classification: "deferred (blocked on authorization)"
      rationale: "Prohibited without separate explicit human authorization; no threshold invented."
    - item: "Degraded-run numeric confidence ceiling (DEBT-014)."
      classification: "deferred (blocked on authorization)"
      rationale: "A ceiling must be specified by policy before enforcement; not invented here. (Stage 3 of the 2026-11-11 approved four-item plan; NOT yet implemented.)"
    - item: "Live latency/token accounting basis for debate budget (DEBT-021/RISK-021)."
      classification: "deferred (blocked on authorization)"
      rationale: "The 2026-11-06 live finding is reproduced and recorded but NOT fixed (source unchanged); requires an authorized implementation round."
    - item: "Claim-date semantic validation of cited evidence (DEBT-022/RISK-020)."
      classification: "deferred (blocked on authorization)"
      rationale: "The 2026-11-06 live finding is recorded but NOT fixed; an allowlist checks eligibility, not claim-date truth."
    - item: "Relocating or duplicating the source tree into src/ or test/."
      classification: "won't (out of scope)"
      rationale: "Inherited layout is mapped via README pointers; the mapping remains an upstream-layout exception pending instructor agreement."

requirements:
  # ---- Deterministic Data Quality Gate (FR-DQG-*) ----
  - id: FR-DQG-001
    type: Feature
    category: functional
    title: Deterministic Data Quality Gate
    description: >
      Provide an LLM-free, pure node that validates the verified market snapshot
      against the five deterministic validation classes (completeness, format,
      freshness, look-ahead, cross-source consistency) and emits a GateDecision
      before the Bull/Bear debate opens.
    priority: Must
    priority_rationale: "See product.priorities for the rationale; Must-level because a violation is a safety/correctness veto."
    tradeoff:
      decision: "Deterministic LLM-free gate."
      rejected_or_deferred: "LLM-based quality judge."
      why: "Non-deterministic, costly, unauditable offline (DQG-ALT-1)."
    origin: user-design
    fit_criterion:
      metric: "Count of failing gate-purity/validation assertions in the named gate test files (no LLM/network call; deterministic five-class validation)."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "failing assertions in tests/test_data_quality_gate_graph.py, tests/test_market_evidence_gate.py, tests/test_evidence_models.py"
      verification:
        method: "The three offline gate test files must report zero failures; a nonzero failure count is a criterion violation. Scope: offline unit/integration of the gate only (not a live path)."
        command: ".venv/bin/python -m pytest tests/test_data_quality_gate_graph.py tests/test_market_evidence_gate.py tests/test_evidence_models.py -q"
        references:
          - "tests/test_data_quality_gate_graph.py"
          - "tests/test_market_evidence_gate.py"
          - "tests/test_evidence_models.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "The whole module's tests pass in the offline suite (logbook 043/065); this criterion counts failing assertions in these files, not a distinct-decision value."
    status: Implemented
    source_files:
      - tradingagents/graph/data_quality_gate.py
      - tradingagents/evidence/gate.py
      - tradingagents/evidence/models.py
      - tradingagents/evidence/validate.py
      - tradingagents/evidence/quality.py
      - tradingagents/evidence/adapter.py
      - tradingagents/evidence/policy.py
    design_artifacts:
      - docs/architecture/adr/001-data-quality-gate.md
      - docs/architecture/invariants.md
    tests:
      - tests/test_data_quality_gate_graph.py
      - tests/test_market_evidence_gate.py
      - tests/test_evidence_models.py
      - tests/test_market_data_validator_structured.py
    verification_evidence:
      - "Stage-2 relevant suite: 402 passed (current tree)."
      - "OpenCode-related suite: 420 passed (supplied)."
    owner: 60536848-WANG-Yiwen

  - id: FR-DQG-002
    type: Feature
    category: invariant-zero-tolerance
    title: Fail-closed gate verdict precedence
    description: >
      The gate must rank decisions blocked > degraded > normal, convert any
      internal exception into a blocked decision, and never silently return
      normal on missing evidence or error.
    priority: Must
    priority_rationale: "See product.priorities for the rationale; Must-level because a violation is a safety/correctness veto."
    tradeoff:
      decision: "Tiered blocked>degraded>normal with exception->blocked."
      rejected_or_deferred: "Binary pass/fail abort."
      why: "Binary blocks tolerable degraded runs (DQG-ALT-4)."
    origin: user-design
    fit_criterion:
      metric: "Runs where a missing/malformed gate state or raised exception yields a non-blocked verdict."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "offline fail-closed tests passing (0 regressions)"
      verification:
        method: "Fail-closed precedence offline tests."
        command: ".venv/bin/python -m pytest tests/test_data_quality_gate_graph.py tests/test_market_evidence_gate.py -q"
        references:
          - "tests/test_data_quality_gate_graph.py"
          - "tests/test_market_evidence_gate.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "Observed PASS (logbook 043)."
    status: Implemented
    source_files:
      - tradingagents/evidence/gate.py
      - tradingagents/graph/data_quality_gate.py
      - tradingagents/graph/conditional_logic.py
    design_artifacts:
      - docs/architecture/adr/001-data-quality-gate.md
      - docs/architecture/invariants.md
    tests:
      - tests/test_data_quality_gate_graph.py
      - tests/test_market_evidence_gate.py
    verification_evidence:
      - "Stage-2 relevant suite: 402 passed (current tree)."
    owner: 60536848-WANG-Yiwen

  - id: FR-DQG-003
    type: Feature
    category: quality
    title: Deterministic gate identifiers and serialization
    description: >
      The run_id must be derived from (trade_date, normalized symbol) and the
      gate output must be JSON/checkpoint-serializable with deterministic
      ordering and ISO-8601 decided_at validation.
    priority: Should
    priority_rationale: "See product.priorities for the rationale; Should-level because impact is bounded but quality-relevant."
    tradeoff:
      decision: "run_id from (trade_date, normalized symbol)."
      rejected_or_deferred: "Random run_id."
      why: "Random IDs break reproducibility (DQG-ALT-5)."
    origin: user-design
    fit_criterion:
      metric: "run_id/evidence IDs derived from random values or non-JSON-serializable gate output."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "serialization/identifier regression failures"
      verification:
        method: "Deterministic ID + JSON-safety tests."
        command: ".venv/bin/python -m pytest tests/test_evidence_models.py tests/test_evidence_step2_regressions.py -q"
        references:
          - "tests/test_evidence_models.py"
          - "tests/test_evidence_step2_regressions.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "Observed PASS (logbook 043)."
    status: Implemented
    source_files:
      - tradingagents/evidence/models.py
      - tradingagents/evidence/adapter.py
      - tradingagents/graph/data_quality_gate.py
    design_artifacts:
      - docs/architecture/adr/001-data-quality-gate.md
      - docs/architecture/memory-design.md
    tests:
      - tests/test_evidence_models.py
      - tests/test_evidence_step2_regressions.py
    verification_evidence:
      - "Stage-2 relevant suite: 402 passed (current tree)."
    owner: 60536848-WANG-Yiwen

  - id: FR-DQG-004
    type: Feature
    category: functional
    title: Multi-category data-quality gate engine
    description: >
      Extend the gate to evaluate exactly one critical market group plus the
      optional categories (fundamentals, news, sentiment). Optional categories
      without a trustworthy structured source produce an explicit deterministic
      unavailable/insufficient result with stable reason codes (fabrication of
      source/date/unit and analyst-prose parsing are prohibited); under a
      versioned multi-category policy they may degrade the verdict but never
      block, while a missing/blocked market category always fails closed to
      blocked. Output is JSON-safe and deterministic (run_id from
      (trade_date, normalized symbol)).
    priority: Must
    priority_rationale: "See product.priorities for the rationale; Must-level because a violation is a safety/correctness veto."
    tradeoff:
      decision: "Optional categories degrade, never block; market blocks if missing."
      rejected_or_deferred: "Equal criticality for all categories."
      why: "Only market is a trustworthy structured source; parity would fabricate criticality."
    origin: user-design
    fit_criterion:
      metric: "Multi-category integration defects where real gate records fail to reach the manifest allowlist, or a null evidence result is fabricated."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "gate->debate integration failures"
      verification:
        method: "Engine + real-gate integration tests."
        command: ".venv/bin/python -m pytest tests/test_stage2_multicategory_gate.py tests/test_gate_debate_integration.py tests/test_data_quality_gate_graph.py -q"
        references:
          - "tests/test_stage2_multicategory_gate.py"
          - "tests/test_gate_debate_integration.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "26 + 9 passed; real gate->manifest chain proven (logbook 043/065)."
    status: Implemented
    source_files:
      - tradingagents/evidence/multi_category_gate.py
      - tradingagents/evidence/gate.py
      - tradingagents/evidence/policy.py
      - tradingagents/graph/data_quality_gate.py
      - tradingagents/evidence/ingest.py
      - tradingagents/evidence/vendor_adapters.py
      - tradingagents/dataflows/evidence_capture.py
      - tradingagents/graph/evidence_tool_node.py
    design_artifacts:
      - docs/architecture/adr/001-data-quality-gate.md
      - docs/architecture/adr/008-automatic-structured-evidence-ingestion.md
      - docs/architecture/invariants.md
    tests:
      - tests/test_stage2_multicategory_gate.py
      - tests/test_gate_debate_integration.py
      - tests/test_structured_evidence_ingestion.py
    verification_evidence:
      - "tests/test_stage2_multicategory_gate.py: 26 passed (current tree)."
      - "2026-11-06 review finding 2 fix: the engine now applies EACH record's own computed QualityStatus, quality reasons, and validation results before serializing (the aggregator's per-record map is no longer discarded); a normal gate with a Medium market group yields citable valid IDs, and genuinely Low/Blocked/future records stay invalid. A real gate -> manifest/allowlist -> researcher -> evaluator -> report regression proves qualified Medium/High evidence counts as new while Low/Blocked/future does not (tests/test_gate_debate_integration.py, 9 passed)."
      - "2026-11-11 Stage 1 (ADR-008, approved plan+tests ONLY, NOT human acceptance): automatic structured optional-evidence ingestion (fundamentals/news/sentiment) from real vendor-origin records through the real tool path + a compiled StateGraph (analyst -> wrapped ToolNode -> clear -> gate -> research -> report), with source-attempt lifecycle, manual-grade clamping, per-category validation and lineage-based independence. tests/test_structured_evidence_ingestion.py: 53 passed; full strict-offline suite 1897 passed / 1 skipped / 1 deselected / 88 subtests / 0 socket attempts (logbook 079)."
    owner: 60536848-WANG-Yiwen

  - id: FR-DQG-005
    type: Feature
    category: quality
    title: Shared deterministic redacted report artifacts
    description: >
      The shared CLI/API report writer (write_report_tree) must emit, for a
      completed run, deterministic redacted artifacts derived only from
      structured run state: 0_quality/evidence_manifest.json,
      0_quality/gate_summary.md, 2_research/debate_trace.json, and
      run_summary.json, plus concise Data Quality / Run Summary sections in
      complete_report.md. No analyst prose (chain-of-thought / hidden prompts)
      is persisted and every value is passed through secret redaction; absent
      gate/debate state (legacy or empty) yields safe defaults, not invented
      values. CLI and programmatic save_reports produce identical output.
    priority: Must
    priority_rationale: "See product.priorities for the rationale; Must-level because a violation is a safety/correctness veto."
    tradeoff:
      decision: "Redacted JSON-safe shared artifacts."
      rejected_or_deferred: "Persist raw analyst prose/chain-of-thought."
      why: "Persisting prose leaks hidden prompts and is non-deterministic."
    origin: user-design
    fit_criterion:
      metric: "Report-artifact defects in per-evidence validation association, identity/provenance, or redaction."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "report-artifact audit failures"
      verification:
        method: "Artifact audit tests (deterministic, offline)."
        command: ".venv/bin/python -m pytest tests/test_report_artifacts_stage2.py tests/test_report_artifacts_audit.py tests/test_reporting.py -q"
        references:
          - "tests/test_report_artifacts_audit.py"
          - "tests/test_report_artifacts_stage2.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "16 + 20 passed (logbook 061/063)."
    status: Implemented
    source_files:
      - tradingagents/report_artifacts.py
      - tradingagents/reporting.py
      - tradingagents/graph/trading_graph.py
      - cli/main.py
    design_artifacts:
      - docs/architecture/adr/001-data-quality-gate.md
      - docs/architecture/adr/002-dynamic-debate-termination.md
      - docs/code-governance/verification-constraints.md
    tests:
      - tests/test_report_artifacts_stage2.py
