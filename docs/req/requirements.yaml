  statement: 'The WebUI shall allow cancelling an active analysis with CLI-equivalent
    semantics: stop execution, write no decision-log entry, clear no checkpoint, preserve
    artifacts already written, and leave the existing checkpoint resumable when checkpointing
    was enabled.'
