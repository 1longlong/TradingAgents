  - id: FR-ANL-009
    type: Feature
    category: invariant-zero-tolerance
    title: Per-run memory isolation from an immutable snapshot
    description: >
      Start each measured run from the same immutable memory snapshot and write
      only to its own per-run copy, so one run's pending decision cannot change
      the next run's prompt context, reflector call or token cost. The snapshot
      hash is registered and hashed into the run config; the copy must live
      inside the run's own attempt directory and must differ from the snapshot;
      a missing or changed memory state invalidates the run.
    priority: Must
    priority_rationale: "Per-run memory isolation is what makes two runs comparable at all."
    tradeoff:
      decision: "One immutable snapshot plus a per-run writable copy with a registered hash."
      rejected_or_deferred: "A single shared mutable memory file across runs."
      why: "A shared file lets one run's pending decision change the next run's prompt and cost."
    origin: user-design
    retrospective_origin:
      classification: retrospective
      rationale: "Recorded after delivery from the memory-isolation implementation, the snapshot provenance record and the isolation tests."
      source_requirement_ids:
