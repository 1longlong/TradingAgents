        command: ".venv/bin/python -m pytest tests/test_c3_final_freeze.py tests/test_token_benchmark.py tests/test_c3_regressions.py -q"
        references:
          - "tests/test_c3_final_freeze.py"
          - "tests/test_token_benchmark.py"
          - "tests/test_c3_regressions.py"
      applicability: offline-test
      status:
