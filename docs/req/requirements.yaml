- id: NFR-CMP-001
  type: quality
  title: Deterministic offline baseline comparison
  statement: 'Provide a pure, LLM-free, network-free comparison model/runner that
    contrasts the legacy fixed-round debate-termination baseline with the dynamic
    policy over identical scripted case identity (ticker, target_date, evidence_snapshot_id,
    policy_version) and identical scripted Bull/Bear turn sequences. Both strategies
    are replayed over the same evidence snapshot; any identity mismatch, missing strategy
    partner, or duplicate result fails closed with PairingError so the two strategies
    are never compared on an unequal footing. No live provider, wall clock, or paid
    API is involved. A replayed run records the ACTUAL deterministic stop reason (e.g.
    no_new_evidence, budget_exhausted, max_rounds_reached) and must distinguish a
    genuinely early-stopped dynamic run from a scripted input that simply ran out
    of rounds (input_exhausted): the latter is never a dynamic-policy early stop and
    is never mislabelled as one.

    '
  priority: must
  priority_tradeoff: 'See product.priorities for the rationale; Must-level because
    a violation is a safety/correctness veto. Decision: Scripted, fail-closed pairing;
    actual stop reason. Rejected/deferred: Compare on unequal footing. Reason: Unequal
    comparison is meaningless.'
  priority_rationale: See product.priorities for the rationale; Must-level because
    a violation is a safety/correctness veto.
  tradeoff:
    decision: Scripted, fail-closed pairing; actual stop reason.
    rejected_or_deferred: Compare on unequal footing.
    why: Unequal comparison is meaningless.
