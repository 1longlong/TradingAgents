      verification:
        method: "Run the named offline test files; a nonzero failure count is a criterion violation."
        command: ".venv/bin/python -m pytest tests/test_token_benchmark.py tests/test_c3_regressions.py -q"
        references:
          - "tests/test_token_benchmark.py"
          - "tests/test_c3_regressions.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "The named harness tests pass offline against archived run directories."
    status: Implemented
    source_files:
