- id: FR-DDT-005
  type: invariant
  title: Deterministic ConflictRecord runtime lifecycle
  statement: 'A pure, LLM-free conflict tracker (src/tradingagents/debate/conflicts.py)
    must create, observe (deduplicate/merge), resolve, and escalate ConflictRecord
    objects deriving conflicts ONLY from the structured conflict_assertions a DebateTurn
    carries (parsed by turn.py from the DEBATE_METADATA conflict_a marker). Stable
    deterministic conflict IDs derive from (normalized topic, kind). Evidence validation
    fails closed: an assert citing an unknown, Low, or future evidence ID never creates
    a conflict, and a re-observation that cites such an ID drops the otherwise-open
    conflict (never kept on unverifiable footing). Empty evidence on a new factual/interpretive
    conflict does not create it; a turn with no assertions (missing metadata) contributes
    no conflict. Action-only disagreement is tracked (so the Research Manager can
    weigh it) but never blocks debate termination. A resolve/escalate closes or promotes
    an open conflict and records the human-readable reason; resolving a non-open conflict
    is a no-op (no second misleading reason). Malformed assertions/under-defined state
    are skipped, never guessed. The evaluator node persists the derived conflicts
