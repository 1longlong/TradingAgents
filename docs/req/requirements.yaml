- id: FR-DDT-005
  type: invariant
  title: Deterministic ConflictRecord runtime lifecycle
  statement: 'A pure, LLM-free conflict tracker (src/tradingagents/debate/conflicts.py) must create, observe
    (deduplicate/merge), resolve, and escalate ConflictRecord objects deriving conflicts ONLY from the
    structured conflict_assertions a DebateTurn carries (parsed by turn.py from the DEBATE_METADATA conflict_a
    marker). Stable deterministic conflict IDs derive from (normalized topic, kind). Evidence validation
    fails closed: an assert citing an unknown, Low, or future evidence ID never creates a conflict, and
    a re-observation that cites such an ID drops the otherwise-open conflict (never kept on unverifiable
    footing). Empty evidence on a new factual/interpretive conflict does not create it; a turn with no
    assertions (missing metadata) contributes no conflict. Action-only disagreement is tracked (so the
    Research Manager can weigh it) but never blocks debate termination. A resolve/escalate closes or promotes
    an open conflict and records the human-readable reason; resolving a non-open conflict is a no-op (no
    second misleading reason). Malformed assertions/under-defined state are skipped, never guessed. The
    evaluator node persists the derived conflicts and a safe, structured, prose-free ConflictSummary (with
    the resolve/escalate resolution notes and an authoritative open-blocking count) to the debate state,
    and the Research Manager injects that summary safely (empty when no tracked conflict, so a bare action-only
    divergence is not presented as a fabricated disagreement).

    '
  priority: must
  priority_tradeoff: 'See product.priorities for the rationale; Must-level because a violation is a safety/correctness
    veto. Decision: Conflicts only from structured assertions. Rejected/deferred: Prose/CoT-derived conflicts.
    Reason: Prose conflicts are fabricated.'
  priority_rationale: See product.priorities for the rationale; Must-level because a violation is a safety/correctness
    veto.
  tradeoff:
    decision: Conflicts only from structured assertions.
    rejected_or_deferred: Prose/CoT-derived conflicts.
    why: Prose conflicts are fabricated.
  origin: extension
  origin_detail: user-design
  source_type: Feature
  source_status: Implemented
  sources:
