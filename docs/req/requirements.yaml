  # ---- Phase 4A offline baseline comparison (NFR-CMP-*) ----
  - id: NFR-CMP-001
    type: NonFunctional
    category: quality
    title: Deterministic offline baseline comparison
    description: >
      Provide a pure, LLM-free, network-free comparison model/runner that
      contrasts the legacy fixed-round debate-termination baseline with the
      dynamic policy over identical scripted case identity (ticker, target_date,
      evidence_snapshot_id, policy_version) and identical scripted Bull/Bear
      turn sequences. Both strategies are replayed over the same evidence
      snapshot; any identity mismatch, missing strategy partner, or duplicate
      result fails closed with PairingError so the two strategies are never
      compared on an unequal footing. No live provider, wall clock, or paid API
      is involved. A replayed run records the ACTUAL deterministic stop reason
      (e.g. no_new_evidence, budget_exhausted, max_rounds_reached) and must
      distinguish a genuinely early-stopped dynamic run from a scripted input
      that simply ran out of rounds (input_exhausted): the latter is never a
      dynamic-policy early stop and is never mislabelled as one.
    priority: Must
    priority_rationale: "See product.priorities for the rationale; Must-level because a violation is a safety/correctness veto."
    tradeoff:
      decision: "Scripted, fail-closed pairing; actual stop reason."
      rejected_or_deferred: "Compare on unequal footing."
      why: "Unequal comparison is meaningless."
    origin: user-design
    fit_criterion:
      metric: "Comparison pairing/identity mismatches silently compared, or input_exhausted mislabelled as a dynamic stop."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "pairing/stop-reason integrity failures"
      verification:
        method: "Comparison runner/schema tests + scripted run."
        command: ".venv/bin/python -m pytest tests/test_comparison_runner.py tests/test_comparison_schemas.py -q"
        references:
          - "tests/test_comparison_runner.py"
          - "tests/test_comparison_schemas.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "90 passed (logbook 055); scripted, not live."
    status: Implemented
    source_files:
      - tradingagents/comparison/runner.py
      - tradingagents/comparison/schemas.py
      - tradingagents/comparison/fixtures.py
      - scripts/run_phase4a_comparison.py
    design_artifacts:
      - docs/architecture/adr/003-phase4a-offline-comparison.md
      - docs/architecture/invariants.md
    tests:
      - tests/test_comparison_runner.py
      - tests/test_comparison_schemas.py
    verification_evidence:
      - "tests/test_comparison_runner.py + tests/test_comparison_schemas.py: 90 passed (current tree; correction round 73 logbook 054; narrow fail-closed correction 90 logbook 055)."
      - "scripts/run_phase4a_comparison.py: 3 scripted cases written to evaluation-output/ (logbook 049); stop_reason now preserved (no_new_evidence / budget_exhausted / max_rounds_reached) in results, JSON/aggregates, and Markdown (correction round, logbook 054)."
      - "Narrow fail-closed correction: CaseResult.__post_init__ rejects a contradictory strategy/early_stopped/stop_reason combination (FIXED is never early-stopped; an early-stopped DYNAMIC result must carry a genuine _DYNAMIC_STOP_REASONS reason) so an inconsistent result can never reach the aggregate/report (logbook 055)."
      - "Human review decision: Phase 4A approved with limitations (WANG Yiwen 60536848, 2026-10-23; logbook 056; docs/review-memo.md). Subject to the four recorded limitations (offline-only, cache baselines remain, traceability pending, no production threshold tuning)."
    owner: 60536848-WANG-Yiwen

  - id: NFR-CMP-002
    type: NonFunctional
    category: quality
    title: Machine-readable measured-vs-estimated comparison metrics
    description: >
      Comparison metrics must be derived deterministically from explicit
      numerators and denominators with documented zero-denominator behavior
      (returns None, never raises or fabricates). Measured provider-reported
      values are separated from deterministic char-based estimates via an
      explicit estimated flag; evidence-citation coverage is derived from valid
      cited evidence IDs (known, High/Medium, on-or-before target, linked to a
      claim) over the snapshot's eligible IDs; false-strong-conclusion rate is
      computed from an explicit strong_conclusion flag plus the gate/quality
      outcome, never inferred from prose; and aggregate sums/rates must be
      derived deterministically and reproducible across runs. Tool-call counts
      (per case and aggregate) and the estimated/measured usage provenance must
      be preserved in the aggregate and surfaced in both the JSON and Markdown
      reports so an estimated value is never presented as measured.
    priority: Must
    priority_rationale: "See product.priorities for the rationale; Must-level because a violation is a safety/correctness veto."
    tradeoff:
      decision: "Explicit estimated flag; separate measured/estimated."
      rejected_or_deferred: "Conflate estimated as measured."
      why: "Conflation misleads (NFR-CMP-002)."
    origin: user-design
    fit_criterion:
      metric: "Aggregates presenting an estimated usage value as measured, or nondeterministic aggregate metrics."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "measured/estimated conflation errors"
      verification:
        method: "Comparison schema/runner tests + report inspection."
        command: ".venv/bin/python -m pytest tests/test_comparison_schemas.py tests/test_comparison_runner.py -q"
        references:
          - "tests/test_comparison_schemas.py"
          - "tests/test_comparison_runner.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "90 passed (logbook 055)."
    status: Implemented
    source_files:
      - tradingagents/comparison/metric_formulas.py
      - tradingagents/comparison/schemas.py
      - tradingagents/comparison/runner.py
      - tradingagents/comparison/report.py
    design_artifacts:
      - docs/architecture/adr/003-phase4a-offline-comparison.md
    tests:
      - tests/test_comparison_schemas.py
      - tests/test_comparison_runner.py
    verification_evidence:
      - "tests/test_comparison_schemas.py + tests/test_comparison_runner.py: 90 passed (correction round 73 logbook 054; narrow fail-closed correction 90 logbook 055)."
      - "evaluation-output/comparison_results.json + comparison_report.md include Total tool calls, per-case Tool calls/Source, Estimated (not measured) cases, and the actual stop reason per case and in the stop-reason aggregate."
      - "Narrow fail-closed correction: early_stop_rate / the early-stop label can never be produced for a contradictory strategy/early_stopped/stop_reason combination (logbook 055)."
      - "Human review decision: Phase 4A approved with limitations (WANG Yiwen 60536848, 2026-10-23; logbook 056; docs/review-memo.md)."
    owner: 60536848-WANG-Yiwen

  - id: NFR-CMP-003
    type: NonFunctional
    category: governance
    title: Human traceability rubric and honest scripted-result labeling
    description: >
      Human traceability uses a documented rubric with human-entered
      per-dimension scores in [0, 1]; an unscored case stays pending with None
      scores rather than fabricating a rating. A SCORED traceability result
      requires exactly four non-null scores, one for each
      TRACEABILITY_DIMENSIONS dimension, in that exact positional order; a
      missing, extra, null, duplicate, or reordered dimension set fails closed
      rather than silently mis-reporting a rating. The Phase 4A comparison output and
      reports must be labeled clearly as deterministic offline scripted-fixture
      results, not live-provider measurements, and must state that no production
      thresholds were tuned and that human score-based traceability is pending a
      human.
    priority: Should
    priority_rationale: "See product.priorities for the rationale; Should-level because impact is bounded but quality-relevant."
    tradeoff:
      decision: "Pending stays pending; human-only scores."
      rejected_or_deferred: "Auto-estimate traceability."
      why: "An AI score would be fabricated."
    origin: course-clause
    fit_criterion:
      metric: "Unscored traceability reported as scored, or non-live results labelled as live measurements."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "traceability/labeling violations"
      verification:
        method: "Schema tests requiring exactly four non-null scores in order; pending stays pending."
        command: ".venv/bin/python -m pytest tests/test_comparison_schemas.py tests/test_comparison_runner.py -q"
        references:
          - "tests/test_comparison_schemas.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "90 passed (logbook 054/055); human scores remain pending (not fabricated)."
    status: Implemented
    source_files:
      - tradingagents/comparison/schemas.py
      - tradingagents/comparison/report.py
      - tradingagents/comparison/runner.py
    design_artifacts:
      - docs/architecture/adr/003-phase4a-offline-comparison.md
    tests:
      - tests/test_comparison_schemas.py
      - tests/test_comparison_runner.py
    verification_evidence:
      - "evaluation-output/comparison_report.md states offline/scripted scope, not a live-provider result; traceability reported as pending (logbook 049)."
      - "tests/test_comparison_schemas.py proves a SCORED result requires exactly four non-null scores in TRACEABILITY_DIMENSIONS order and rejects missing/extra/null/reordered sets; PENDING results stay pending (correction round; logbook 054)."
      - "tests/test_comparison_schemas.py + tests/test_comparison_runner.py: 90 passed incl. fail-closed strategy/early_stopped/stop_reason consistency (narrow correction, logbook 055)."
      - "Human review decision: Phase 4A approved with limitations (WANG Yiwen 60536848, 2026-10-23; logbook 056; docs/review-memo.md); human traceability scores remain pending, not entered."
    owner: 60536848-WANG-Yiwen