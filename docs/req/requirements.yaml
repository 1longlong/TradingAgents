schema_version: '1.1'
project:
  name: TradingAgents — shared analysis, WebUI and standalone simulation
  purpose: Extend the existing TradingAgents analysis system with a WebUI while retaining
    the integrated release data-quality gate, dynamic debate, evidence, usage accounting,
    reporting, backtesting, recovery, CLI and Python API.
  baseline_ref: release
  baseline_commit: 2d17df8da1536c121e4d7395ac5a5dcec9e96d6f
  scope:
  - Deterministic Data Quality Gate (FR-DQG-001..006).
  - Dynamic debate termination + conflict lifecycle (FR-DDT-001..005).
  - Non-functional guarantees (NFR-DET/FC/PIT/AUD/BUD/BC/OFF/SEC-001).
  - Phase 4A deterministic offline baseline comparison (NFR-CMP-001..003).
  - An eight-step analysis parameter wizard equivalent to the CLI, with server-side
    API-key status in place of interactive key entry.
  - Live run progress, messages, tool calls, current report, and footer statistics
    equivalent to the CLI live view.
  - Checkpoint controls, portfolio JSON input, cancellation, and a single active run.
  - Completion summary, the complete I-V report, fixed-directory persistence, and
    browser downloads.
  - Read-only history over existing artifacts, without a new database or retention
    policy.
  - Backtest launch and result views equivalent to the CLI backtest command.
  - Chinese/English interface switching.
  - Local loopback deployment without authentication for one user.
  - Standalone deterministic simulated trading and safety subsystem imported from
    release 24adf97 (FR-TRD/INV-TRD/NFR-TRD).
  out_of_scope:
  - Real broker execution or WebUI order placement; standalone simulated execution
    is imported separately.
  - New data sources, model providers, agents, prompts, or rating rules.
  - Multi-user, multi-tenant, billing, or authentication.
  - New databases, message queues, cloud deployment, or container orchestration.
  - PDF or Word export, and native mobile applications.
  - Multi-ticker batch analysis outside the existing backtest capability.
  - Cross-run comparison, scoring dashboards, or backtest charts.
  - Unrequested changes to CLI/core semantics beyond importing the approved release
    capabilities.
  branch: feature/webui
  schema_version: v1.1
  deliverable_slide_sources:
  - src/
  - test/offline/
  - test/live/
  canonical_source_trees:
  - src/tradingagents/
  - src/cli/
  - src/tradingagents_web/
  - src/trading/
  - src/safety/
  integrated_release_commit: 24adf97180e3856f3ac64964a46d60045fd418f8
