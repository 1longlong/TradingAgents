- id: FR-ANL-003
  type: functional
  title: Typed analyst reports with a labelled free-text fallback
  statement: 'Let the three tool-loop analysts emit typed, schema-validated reports
    (stance, evidence, levels, risks and interpretation) instead of only free prose.
    When a provider cannot bind a schema, or the structured switch is off, fall back
    to free text and still render a non-empty analyst report with explicitly labelled
    missing fields rather than a blank one.

    '
  priority: must
  priority_tradeoff: A hard schema requirement breaks providers that cannot bind one;
    prose-only output cannot be gated.
  priority_rationale: Typed analyst reports are the structured input the gate and
    the debate consume.
  tradeoff:
    decision: Schema-bound typed output with a labelled free-text fallback.
    rejected_or_deferred: Always free prose, or always demanding a schema.
    why: A hard schema requirement breaks providers that cannot bind one; prose-only
      output cannot be gated.
