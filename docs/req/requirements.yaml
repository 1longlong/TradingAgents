      rationale: "Measured vs estimated must never be conflated, or the comparison misleads."
    - requirement_id: NFR-CMP-003
      priority: Should
      rationale: "Honest labeling/traceability is important for integrity but is a presentation-layer property."
    - requirement_id: FR-TRD-001
      priority: Must
      rationale: "Deterministic safety gate for every advisory decision is a Must because it protects a core deterministic or safety property."
    - requirement_id: FR-TRD-002
      priority: Must
      rationale: "Simulated executor with atomic cash and position updates is a Must because it protects a core deterministic or safety property."
    - requirement_id: FR-TRD-003
      priority: Must
      rationale: "Portfolio state with cost basis and PnL is a Must because it protects a core deterministic or safety property."
    - requirement_id: FR-TRD-004
      priority: Must
      rationale: "Append-only tamper-evident audit log is a Must because it protects a core deterministic or safety property."
    - requirement_id: FR-TRD-005
      priority: Must
      rationale: "Walk-forward simulation with an injected clock is a Must because it protects a core deterministic or safety property."
    - requirement_id: FR-TRD-006
      priority: Must
      rationale: "Portfolio persistence, reset, and bankruptcy protection is a Must because it protects a core deterministic or safety property."
    - requirement_id: INV-TRD-001
      priority: Must
      rationale: "No execution without an APPROVED evaluation is a Must because it protects a core deterministic or safety property."
    - requirement_id: INV-TRD-002
      priority: Must
      rationale: "Rule engine is the only executor entry point is a Must because it protects a core deterministic or safety property."
    - requirement_id: INV-TRD-003
      priority: Must
      rationale: "Audit log is append-only is a Must because it protects a core deterministic or safety property."
    - requirement_id: NFR-TRD-001
      priority: Must
      rationale: "100% rejection of hard safety-rule violations is a Must because it protects a core deterministic or safety property."
    - requirement_id: FR-ANL-001
      priority: Must
      rationale: "The pipeline topology is the delivered product; without it no other requirement can be exercised."
    - requirement_id: FR-ANL-002
      priority: Must
      rationale: "A typed, explicit vendor failure is what stops an outage being reported as an empty success."
    - requirement_id: FR-ANL-003
      priority: Must
      rationale: "Typed analyst reports are the structured input the gate and the debate consume."
    - requirement_id: FR-ANL-004
      priority: Must
      rationale: "An unattributed usage event makes a measured run unmeasurable, so attribution gates every cost claim."
    - requirement_id: FR-ANL-005
      priority: Should
      rationale: "Single-pass removes a redundant paid call but the system remains correct without it."
    - requirement_id: FR-ANL-006
      priority: Should
      rationale: "The switch is an experiment ablation, not a safety property."
    - requirement_id: FR-ANL-008
      priority: Must
      rationale: "Single-source news provenance is a scope commitment of the delivered study."
    - requirement_id: FR-ANL-009
      priority: Must
      rationale: "Per-run memory isolation is what makes two runs comparable at all."
    - requirement_id: FR-OBS-001
      priority: Must
      rationale: "Without event-level accounting every token claim is unfalsifiable."
    - requirement_id: FR-OBS-002
      priority: Must
      rationale: "A verdict that is computed but not consumed protects nothing."
    - requirement_id: FR-OBS-003
      priority: Must
      rationale: "Tool and system-component calls billed outside the agent buckets would silently inflate totals."
    - requirement_id: FR-OBS-004
      priority: Must
      rationale: "An unaccounted call voids the sample; the bound is zero-tolerance."
    - requirement_id: FR-OBS-005
      priority: Must
      rationale: "Aggregation that double-counts a retry or drops a failed attempt misreports the experiment."
    - requirement_id: FR-HAR-001
      priority: Must
