  - id: FR-HAR-003
    type: Feature
    category: cost
    title: Fail-closed spend contract for authorised paid runs
    description: >
      A paid measurement run may spend only under an explicit budget contract.
      A null token cap means unlimited ONLY when the registration explicitly
      declares budget_mode uncapped_authorized. A missing protocol file, a
      malformed budget block, a missing or invalid mode and a non-integer cap
      are each distinct refusals rather than defaults, and an unreadable or
      unknown spend figure is reported as unknown rather than as zero.
      Reserved tokens count toward a real cap, and a run whose budget contract
      cannot be verified is refused before the first paid call.
    priority: Must
    priority_rationale: "An unverified budget contract can authorise unbounded paid spend; this is a cost-safety veto and a separate enforcement point from the debate-level summary reserve."
    tradeoff:
      decision: "Every paid run is admitted through an explicit, mode-declared budget contract."
      rejected_or_deferred: "Treating a null cap or an unreadable budget file as unlimited."
      why: "A default-to-unlimited fallback is an unauthorised spend path, so the only safe default is refusal."
    origin: user-design
    retrospective_origin:
      classification: retrospective
      rationale: "The U-2 budget-contract defect was classified and repaired during the campaign; this row records the delivered contract after the fact. It is kept separate from NFR-BUD-001 because that row governs the debate summary reserve, not paid-run admission, and its fit criterion would not describe this contract."
      source_requirement_ids:
        - "FR-012"
    fit_criterion:
      metric: "Count of budget-contract unit-test failures (null-cap mode semantics, distinct refusals, unknown-spend-not-zero, reserved tokens counted toward a real cap)."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "failing assertions in tests/test_budget_guard.py"
      verification:
        method: "Run the budget-guard unit tests; a nonzero failure count is a criterion violation. No paid call is made and no live spend is claimed."
        command: ".venv/bin/python -m pytest tests/test_budget_guard.py -q"
        references:
          - "tests/test_budget_guard.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "tests/test_budget_guard.py exercises the contract offline. The live campaigns that used it are not re-run, so no live budget outcome is claimed."
    status: Implemented
    source_files:
      - scripts/token_benchmark.py
      - tradingagents/budget_guard.py
      - scripts/gen_cand01_batch_16run_specs_v3.py
    design_artifacts:
