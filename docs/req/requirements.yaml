  - id: REQ-WEB-020
    type: security
    statement: >-
      The WebUI shall bind only to 127.0.0.1, require no authentication, reject
      non-loopback Host headers, and reject cross-origin state-changing requests.
    priority: must
    priority_tradeoff: >-
      The confirmed deployment is a single local user. No authentication is
      acceptable only because the listener is loopback-only and same-origin
      checks compensate. Binding broadly without authentication would expose
      analysis runs and artifacts to the local network.
