migration_notes:
- Unified format approved by the user in the current conversation on 2026-11-19. This is format/merge
  authorization, not a new product approval or runtime verification.
- All 22 core and 26 WebUI requirement IDs are retained. The 26 WebUI entries are unchanged; draft remains
  draft. Core Implemented maps to implemented, never to newly verified.
- Core title, original type/status/origin category, priority rationale, structured tradeoff, source/design/test
  mappings and verification evidence are retained in named fields.
- Core fit_criterion becomes one fit_criteria item with a deterministic FC-<original-requirement-id>-01
  identifier. Operator spelling is normalized; threshold, type, applicability, explanation and original
  evidence status are preserved.
- Invariant criteria use unit violations for the existing zero-tolerance rule; original descriptive unit
  is retained as measurement_unit. Historical criterion status is explicitly scoped historical-release.
- Repository paths and verification commands are translated to the existing src/test layout. Stored commands
  are data and are never automatically executed.
- Original release scope deferrals are preserved in product.historical_scope; later inherited implementations
  and the previously authorized layout are not misrepresented as still blocked. Live benchmarking and
  production tuning remain deferred.
- Tool display labels follow the existing OpenCode naming instruction; original branch provenance is recorded
  in source_baselines.
