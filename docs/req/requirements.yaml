- id: FR-OBS-003
  type: quality
  title: Tool-round and system-component events counted outside agent buckets
  statement: 'Account for provider calls that happen outside a graph node, including
    tool rounds and the pre-graph reflector, without inflating any agent bucket. Such
    calls are attributed to a named system component or to the explicit unattributed
    bucket, and the run totals include them, so a total never omits a call that was
    billed.

    '
  priority: must
  priority_tradeoff: Rolling them up overstates an agent's cost and makes per-agent
    comparison meaningless.
  priority_rationale: Tool and system-component calls billed outside the agent buckets
    would silently inflate totals.
  tradeoff:
    decision: Keep a separate system-component and unattributed bucket and include
      both in run totals.
    rejected_or_deferred: Rolling non-agent calls into the nearest agent's subtotal.
    why: Rolling them up overstates an agent's cost and makes per-agent comparison
      meaningless.
