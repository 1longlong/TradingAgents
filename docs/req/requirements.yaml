  - id: NFR-VER-002
    type: NonFunctional
    category: governance
    title: Executed verification instead of simulated results
    description: >
      Claims about the delivered system are produced by commands that were
      actually executed in the repository, not by reading files, inferring
      from structure or fabricating plausible output. When a tool needed for
      execution is unavailable, the agent establishes that fact by an actual
      call and recovers execution capability, or reports the limitation, rather
      than substituting a simulated result. Delegated reviewers are read-only
      and can fail a candidate.
    priority: Must
    priority_rationale: "This is the most repeated human correction in the recorded sessions; a verification claim that was simulated is indistinguishable from a fabricated result."
    tradeoff:
      decision: "Prove execution with an actual call, or report the limitation explicitly."
      rejected_or_deferred: "Static reading, inference or simulated output presented as verification."
      why: "The failure mode is silent: a simulated result looks exactly like an executed one, so only an execution trail distinguishes them."
    origin: governance
    retrospective_origin:
      classification: retrospective
      rationale: "The operator corrected this repeatedly during the campaign; this row records the delivered process obligation after the fact. It is a process control and is not mechanically enforced."
      source_requirement_ids:
        - "NFR-005"
    fit_criterion:
      metric: "Count of verification claims in the D1 report that cite a command not executed in the reporting session."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "unexecuted verification claims"
      verification:
        method: "Read the D1 verification section and check each PASS/FAIL/NOT_RUN label against a recorded command and its actual output; a claim without an executed command is a violation."
        command: "not a runnable command: manual read of the D1 validation report in docs/ai-use-session-audit.md against the recorded command list"
        references:
          - "docs/ai-use-session-audit.md"
          - "tests/conftest.py"
      applicability: governance
      status:
        state: partially_verified
        evidence: "The D1 report labels every check PASS/FAIL/NOT_RUN and records the exact command; the control is DOCUMENTED_ONLY, so effectiveness depends on review, which is why the human-review status stays PENDING_HUMAN_REVIEW."
    status: Implemented
    source_files:
      - tests/conftest.py
      - scripts/c3_verify_final_freeze.py
      - scripts/c3_finalize_freeze.py
      - scripts/c3_preflight_gate.py
    design_artifacts:
      - docs/code-governance/verification-constraints.md
      - docs/ai-use-session-audit.md
    tests:
      - tests/test_c3_final_freeze.py
      - tests/test_governance_scaffold.py
    verification_evidence:
      - "tests/conftest.py blocks live vendor calls and supplies dummy credentials, so an offline run cannot silently reach a paid endpoint."
      - "scripts/c3_verify_final_freeze.py recomputes hashes and refuses a drifted tree, so a recorded verification cannot be asserted without executing it."
      - "Rehearsal and rehearsal-failure paths exist in tests/test_c3_final_freeze.py, so a green rehearsal is distinguishable from a rehearsal that cannot fail."
    owner: 60536848-WANG-Yiwen
