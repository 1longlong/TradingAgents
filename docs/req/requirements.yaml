- id: REQ-WEB-001
  type: functional
  statement: 'The WebUI shall expose the complete eight-step analysis selection flow:
    ticker, analysis date, output language, analyst selection, research depth, LLM
    provider and endpoint, quick/deep models with provider thinking parameters, and
    last-run preferences, with server-side API-key status in place of interactive
    key entry.'
  priority: must
  priority_tradeoff: A complete wizard is the only way to guarantee that every analysis
    input visible in the CLI is also visible in the WebUI. The cost is a longer form;
    prefill, environment detection, and clear defaults mitigate it. Skipping a step
    would hide a decision that changes analysis behavior.
  origin: extension
  sources:
