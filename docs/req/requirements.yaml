  type: governance
  title: Optimisation campaign with an explicit accept-or-revert decision
  statement: 'Evaluate each token-optimisation idea as a campaign round with a fixed
    sequence: research, hypothesis, offline analysis, implementation, tests, a real
    multi-run measurement and a quality assessment, followed by an explicit accept
    or revert decision. A round whose measured gain does not clear its stated threshold
    is reverted rather than retained, and the revert is recorded with the numbers
    that justified it.

    '
  priority: should
  priority_tradeoff: A round that does not clear its stated threshold must be reverted,
    or the campaign becomes anecdote.
  priority_rationale: The accept-or-revert discipline governs how optimisations were
    decided; the delivered tree is pinned by it but does not depend on it at runtime.
  tradeoff:
    decision: Research-measure-accept-or-revert with the numbers recorded on revert.
    rejected_or_deferred: Keeping an optimisation because it seemed plausible.
    why: A round that does not clear its stated threshold must be reverted, or the
      campaign becomes anecdote.
  origin: extension
  origin_detail: user-design
