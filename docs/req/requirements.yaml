- id: FR-OBS-002
  type: functional
  title: Evaluated usage-completeness verdict that gates validity
  statement: 'Classify every telemetry payload as VALID, MISSING, INCOMPLETE or MISMATCH,
    and allow only VALID to produce a measured sample. The verdict is consumed by
    the validity decision rather than merely computed. An unknown token total is reported
    as null and never zero, and a replay that disagrees with the recorded totals voids
    the run.

    '
  priority: must
  priority_tradeoff: A verdict nobody acts on lets an incomplete run be published
    as measured.
  priority_rationale: A verdict that is computed but not consumed protects nothing.
  tradeoff:
