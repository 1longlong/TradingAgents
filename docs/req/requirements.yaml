- id: FR-ANL-002
  type: functional
  title: Typed vendor failures instead of silent empty successes
  statement: 'Classify vendor, parser and data-quality failures with typed exceptions
    and explicit statuses instead of converting them into empty successful results.
    A failure that leaves usage, attribution, memory, switches or the budget contract
    unverifiable shall void the run or refuse it before spending, rather than treating
    the absence of evidence as success.

    '
  priority: must
  priority_tradeoff: An empty success is indistinguishable from 'no news', so an outage
    would be reported as a finding.
  priority_rationale: A typed, explicit vendor failure is what stops an outage being
    reported as an empty success.
  tradeoff:
    decision: Typed vendor exceptions with explicit statuses at every adapter boundary.
    rejected_or_deferred: Returning an empty successful result when a vendor is unreachable.
    why: An empty success is indistinguishable from 'no news', so an outage would
      be reported as a finding.
