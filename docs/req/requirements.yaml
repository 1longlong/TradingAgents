  - id: NFR-OFF-001
    type: NonFunctional
    category: governance
    title: Offline testability
    description: >
      The default `pytest -q` run must require no network or paid API. Vendor and
      live tests are marked `@pytest.mark.integration` and are opt-in.
    priority: Must
    priority_rationale: "See product.priorities for the rationale; Must-level because a violation is a safety/correctness veto."
    tradeoff:
      decision: "Offline default; live opt-in integration."
      rejected_or_deferred: "Network/LLM in CI."
      why: "Non-deterministic, costly, unauthorized."
    origin: governance
    fit_criterion:
      metric: "Count of outbound network connection attempts (socket.socket.connect / socket.socket.connect_ex / socket.create_connection) attempted by the default non-integration pytest run, measured by the count-and-fail strict-offline harness."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "network connection attempts during the socket-disabled non-integration run"
      verification:
        method: "The documented count-and-fail harness (`scripts/validate/strict_offline_harness.py`) disables socket.socket.connect, socket.socket.connect_ex and socket.create_connection with a recorder that COUNTS each attempt and raises OSError, then asserts zero attempts and runs `pytest -q -p no:cacheprovider -m 'not integration'`. SCOPE + HONEST LIMITATION: an INTERCEPTED attempt is OBSERVED today — one attempt from the EXISTING baseline `tests/test_no_data_handling.py::TestLoadOhlcvNoPoison::test_empty_download_raises_and_does_not_cache` (vendor-reachability probe via requests/urllib3). No connection is made (the recorder raises), but the attempt count is NOT zero, so NFR-OFF-001 is NOT fully satisfied and stays OPEN (DEBT-002/RISK-002). The harness fails closed on any attempt; it does NOT assert the run is green (known cache/network baselines may fail and are recorded separately). No baseline test/CI/waiver is modified."
        command: ".venv/bin/python scripts/validate/strict_offline_harness.py"
        references:
          - "tests/conftest.py"
          - "scripts/validate/strict_offline_harness.py"
      applicability: offline-test
      status:
        state: partially_verified
        evidence: "OFFLINE PROPERTY PARTIAL: the harness records and fails closed on every forbidden attempt; the observed baseline test makes 1 intercepted vendor-reachability attempt (no connection made), so zero-attempt is NOT achieved (DEBT-002/RISK-002 OPEN; not modified). The non-integration run is also not all-green (4 known baselines: 3 date-sensitive ohlcv cache + the no-data vendor-reachability baseline). Recorded truthfully, not hidden."
    status: Implemented
    source_files:
      - tests/conftest.py
      - scripts/validate/strict_offline_harness.py
    design_artifacts:
      - docs/code-governance/verification-constraints.md
    tests:
      - tests/test_data_quality_gate_graph.py
      - tests/test_debate_evaluator.py
      - tests/test_governance_scaffold.py
    verification_evidence:
      - "Stage-2 relevant suite: 402 passed offline (current tree)."
      - "Count-and-fail harness (scripts/validate/strict_offline_harness.py): records and fails closed on every forbidden socket attempt. OBSERVED today: 1 intercepted vendor-reachability attempt from the existing tests/test_no_data_handling.py baseline (no connection made); zero-attempt NOT achieved — NFR-OFF-001 PARTIAL/OPEN (DEBT-002/RISK-002), not modified."
    owner: 60536848-WANG-Yiwen

