- id: FR-DQG-006
  type: invariant
  title: Authoritative blocked verdict at the output boundary
  statement: 'A blocked Data Quality Gate verdict must remain authoritative through
    the downstream stored recommendations and the final signal/report. A single deterministic,
    LLM-free output guard reads the gate state fail-closed (missing/malformed/inconsistent
    -> blocked) and pins the executable decision field (Recommendation / Rating /
    Action) to Hold on blocked runs, for both structured and free-text output, plus
    every repeated decision header and every Final Transaction Proposal marker; it
    never rewrites arbitrary rationale prose. On a blocked Trader output, executable
    entry/stop/position-sizing values are neutralised (a documented narrow rule) while
    the quoted rationale is preserved. A degraded (not blocked) run additionally enforces
    a deterministic confidence ceiling (ADR-011 Stage 4, approved 0.60 engineering
    ceiling) on explicit confidence-labelled numerics across the debate, managers,
    trader, portfolio decision, every post-gate model prompt read, the saved report
    and the memory log; it is not applied to a blocked run (which keeps its non-numeric
    Hold discipline) and is not a calibrated probability or production threshold tuning.

    '
  priority: must
  priority_tradeoff: 'See product.priorities for the rationale; Must-level because
    a violation is a safety/correctness veto. Decision: Pin decision fields to Hold,
    preserve rationale. Rejected/deferred: Rewrite entire report neutral. Reason:
    Full rewrite destroys auditability.'
  priority_rationale: See product.priorities for the rationale; Must-level because
    a violation is a safety/correctness veto.
  tradeoff:
    decision: Pin decision fields to Hold, preserve rationale.
    rejected_or_deferred: Rewrite entire report neutral.
