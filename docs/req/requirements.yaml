  - id: REQ-WEB-006
    type: functional
    statement: >-
      The WebUI shall admit at most one active analysis or backtest run and
      reject a second submission with a conflict error that identifies the
      active run.
    priority: must
    priority_tradeoff: >-
      The core uses a global configuration singleton and a read-modify-write
      decision log. A single active run is the smallest safe synchronization
      mechanism. The cost is no parallel analyses; that is an accepted scope
      boundary for this iteration.
    origin: extension
    sources:
      - kind: human_decision
        reference: Requirements discussion in the current session, 2026-11-05
        locator: Batch 3 concurrency selection
        rationale: The user selected one active run at a time.
      - kind: repository
        reference: src/tradingagents/dataflows/config.py
        locator: _config, set_config()
        rationale: Shows that configuration is process-global and shared by graph instances.
      - kind: repository
        reference: src/tradingagents/agents/utils/memory.py
        locator: update_with_outcome(), batch_update_with_outcomes()
        rationale: Shows read-modify-write behavior that concurrent runs would race.
    status: draft
    architecture_refs:
      - architecture-blueprint.md#w2-run-coordinator
      - architecture-blueprint.md#run-state
    invariant_refs:
      - INV-WEB-009
    owner: webui
    depends_on:
