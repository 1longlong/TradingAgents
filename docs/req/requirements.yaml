  - id: FR-DQG-006
    type: Feature
    category: invariant-zero-tolerance
    title: Authoritative blocked verdict at the output boundary
    description: >
      A blocked Data Quality Gate verdict must remain authoritative through the
      downstream stored recommendations and the final signal/report. A single
      deterministic, LLM-free output guard reads the gate state fail-closed
      (missing/malformed/inconsistent -> blocked) and pins the executable
      decision field (Recommendation / Rating / Action) to Hold on blocked runs,
      for both structured and free-text output, plus every repeated decision
      header and every Final Transaction Proposal marker; it never rewrites
      arbitrary rationale prose. On a blocked Trader output, executable
      entry/stop/position-sizing values are neutralised (a documented narrow
      rule) while the quoted rationale is preserved. A degraded (not blocked) run
      additionally enforces a deterministic confidence ceiling (ADR-011 Stage 4,
      approved 0.60 engineering ceiling) on explicit confidence-labelled numerics
      across the debate, managers, trader, portfolio decision, every post-gate
      model prompt read, the saved report and the memory log; it is not applied to
      a blocked run (which keeps its non-numeric Hold discipline) and is not a
      calibrated probability or production threshold tuning.
    priority: Must
    priority_rationale: "See product.priorities for the rationale; Must-level because a violation is a safety/correctness veto."
    tradeoff:
      decision: "Pin decision fields to Hold, preserve rationale."
      rejected_or_deferred: "Rewrite entire report neutral."
      why: "Full rewrite destroys auditability."
    origin: user-design
    fit_criterion:
      metric: "Blocked-run outputs whose parsed/plain final signal is not Hold (structured or free-text)."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "blocked-signal escape regressions"
      verification:
        method: "Output-guard tests incl. full graph and fullwidth/long/proposal formats."
        command: ".venv/bin/python -m pytest tests/test_output_guard.py -q"
        references:
          - "tests/test_output_guard.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "130 passed, includes stored-plan + saved-report cases (logbook 067); awaits human review."
    status: Implemented
