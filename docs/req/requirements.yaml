  - id: FR-OBS-001
    type: Feature
    category: quality
    title: Event-level token accounting with a null-not-zero rule
    description: >
      Record every provider call as an observable event with separate input,
      output, cached and reasoning token counts, the provider's raw usage blob,
      call order and attribution. An absent count is recorded as null and never
      as zero, negative counts are rejected, a duplicate end-of-call callback for
      the same run is counted once, and a run's totals equal the sum of its own
      events.
    priority: Must
    priority_rationale: "Without event-level accounting every token claim is unfalsifiable."
    tradeoff:
      decision: "Record input/output/cached/reasoning counts separately with absent fields null."
      rejected_or_deferred: "A single total per call, or zero for an absent field."
      why: "A total hides the cached/uncached split, and zero is a measurement rather than a missing value."
    origin: user-design
    retrospective_origin:
      classification: retrospective
      rationale: "Written after the observability layer existed, from the collector and its tests. The distinction between missing and zero was already enforced in code; this row is the requirement wording."
      source_requirement_ids:
        - "NFR-001"
    fit_criterion:
      metric: "Count of failing accounting assertions (four fields recorded separately, absent field null, negative rejected, duplicate callback counted once, totals equal the event sum) in the named offline test files."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "failing assertions in tests/test_observability.py, tests/test_graph_tool_observability.py, tests/test_whole_run_usage.py"
      verification:
        method: "Run the named offline test files; a nonzero failure count is a criterion violation."
        command: ".venv/bin/python -m pytest tests/test_observability.py tests/test_graph_tool_observability.py tests/test_whole_run_usage.py -q"
        references:
          - "tests/test_observability.py"
          - "tests/test_graph_tool_observability.py"
          - "tests/test_whole_run_usage.py"
      applicability: offline-test
      status:
        state: verified
        evidence: "The named files pass offline against scripted transports; no provider is contacted."
    status: Implemented
    source_files:
