  - id: REQ-WEB-007
    type: functional
    statement: >-
      The WebUI shall continue an active run when the browser disconnects and
      allow the browser to reattach within the lifetime of the server process;
      after a process restart the active run is not recovered.
    priority: must
    priority_tradeoff: >-
      Analyses can run for minutes. Tying them to a browser tab would waste
      provider spend. The cost is an in-memory event buffer and a snapshot path;
      cross-process recovery is deliberately excluded to avoid new storage.
    origin: extension
    sources:
      - kind: human_decision
        reference: Requirements discussion in the current session, 2026-11-05
        locator: Batch 3 reconnect selection and Batch 4 lifetime confirmation
        rationale: The user selected background continuation with process-lifetime reattachment.
      - kind: repository
        reference: src/cli/main.py
        locator: run_analysis() stream loop
        rationale: Shows that the run itself does not depend on a browser connection.
    status: draft
    architecture_refs:
      - architecture-blueprint.md#w2-run-coordinator
      - architecture-blueprint.md#reattachment
      - architecture-blueprint.md#w4-event-projection
    invariant_refs: []
    owner: webui
    depends_on:
