  - id: FR-ANL-010
    type: Feature
    category: functional
    title: Vendor-routed market, news and macro data acquisition
    description: >
      Acquire market data, company news, fundamental data and macroeconomic
      series through a vendor-routing dataflow layer rather than by calling a
      provider directly from an agent tool. Market prices and indicators come
      from the configured market vendor, company news from Finnhub,
      fundamentals from the configured fundamentals vendor and macro series
      from FRED. Every result is rendered as a dated, agent-readable report
      rather than a raw payload, and a missing credential or an unavailable
      vendor produces a typed, explicit failure instead of a silent empty
      success.
    priority: Must
    priority_rationale: "Every gate, debate and decision consumes data acquired here; an untyped acquisition failure would be indistinguishable from authoritative-empty data and would invalidate the run."
    tradeoff:
      decision: "One routing layer in front of all vendor calls, with dated rendered reports."
      rejected_or_deferred: "Per-agent direct vendor calls and raw-payload passthrough."
      why: "The data-quality gate and the point-in-time controls need one capture point per vendor call; direct provider calls from an agent would bypass both."
    origin: inherited-system
    retrospective_origin:
      classification: retrospective
      rationale: "The dataflow routing layer is inherited from upstream; this row records the delivered routing, rendering and failure behaviour after the fact and does not claim it was specified in advance."
      source_requirement_ids:
