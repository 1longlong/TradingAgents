- id: NFR-VER-001
  type: governance
  title: Executed offline test suite and independent audit
  statement: 'The delivered code is verified by an executable offline test suite and
    by independent read-only audits rather than by assertion. The recorded suite at
    the token-observability commit 50b2ca3 reported 2,227 passed, 4 known failed,
    2 skipped and 319 subtests, and a .env-free run of the same deliverable reported
    2,233 passed, 0 failed, 2 skipped and 319 subtests; three independent audits reported
    PASS. A known failure is named with its cause and is never removed by weakening
    an assertion, and a numeric result quoted from a session report is labelled as
    a session self-report until it is re-run.

    '
  priority: must
  priority_tradeoff: A green claim that hides a known failure is worse than a named
    failure, because it removes the signal a reviewer needs.
  priority_rationale: A delivery whose only evidence is prose cannot be audited; the
    suite and the independent audits are the verification of record.
  tradeoff:
