  - id: FR-OBS-005
    type: Feature
    category: cost
    title: Telemetry selection integrity across repeated attempts
    description: >
      When an attempt is restarted, select exactly one telemetry artifact for the
      measured attempt by a rule fixed before the run starts, never silently
      preferring the larger or the newer file, and preserve every superseded
      artifact as evidence rather than overwriting it. Cross-run aggregation
      keeps failed attempts and never reports a missing value as zero.
    priority: Must
    priority_rationale: "Aggregation that double-counts a retry or drops a failed attempt misreports the experiment."
    tradeoff:
      decision: "Preserve every attempt and apply a selection rule fixed before the run."
      rejected_or_deferred: "Prefer the newest or largest telemetry file."
      why: "Preferring a file after the fact is hindsight selection and inflates the reported sample."
    origin: user-design
    retrospective_origin:
      classification: retrospective
      rationale: "Added after reviewing the recorded sessions found that repeated-attempt selection had no identifier. It describes delivered harness behaviour."
      source_requirement_ids:
