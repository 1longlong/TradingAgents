  - id: NFR-BUD-001
    type: NonFunctional
    category: cost
    title: Budget safety
    description: >
      Debate termination must reserve summary tokens/time and enforce
      max tokens/time/calls so a run cannot exhaust budget mid-debate and lose
      its report.
    priority: Must
    priority_rationale: "See product.priorities for the rationale; Must-level because a violation is a safety/correctness veto."
    tradeoff:
      decision: "Reserve + refuse overcalls pre-dispatch."
      rejected_or_deferred: "Best-effort, one-call slack."
      why: "Guaranteed report outweighs a hop."
    origin: user-design
    fit_criterion:
      metric: "Count of summary-reserve violations: a pre-call admission where remaining budget < reserved_summary + estimated next-call cost, or a mid-debate exhaustion that loses the summary. A nonnegative configured reserve value is NOT itself evidence of enforcement; only the admission-guard outcome is counted."
      operator: "=="
      threshold_type: count
      threshold: 0
      unit: "summary-reserve violations in the offline admission-guard tests (estimate-based scope)"
      verification:
        method: "Offline budget + pre-call guard tests (reserve + estimated next-call cost, exact token/time boundaries) must show zero reserve violations. SCOPE: OFFLINE, ESTIMATE-BASED admission only — this does not measure real provider latency/token accounting. Real latency/token integration behavior is PARTIALLY VERIFIED at best and is recorded OPEN in DEBT-021: a 2026-11-06 live run showed the estimate (2171.77 s vs actual 12.72 s; 16,289 est vs 18,058 reported tokens) exhausted the time budget before Bear with 0 complete rounds."
        command: ".venv/bin/python -m pytest tests/test_debate_budget.py tests/test_debate_precall_budget.py tests/test_durable_usage_ledger.py tests/test_whole_run_usage.py -q"
        references:
          - "tests/test_debate_precall_budget.py"
          - "tests/test_debate_budget.py"
          - "tests/test_durable_usage_ledger.py"
          - "tests/test_whole_run_usage.py"
      applicability: offline-test
      status:
        state: partially_verified
        evidence: "Offline estimate-based guard: 22 pre-call tests pass with zero reserve violations (logbook 060/063); Stage 2 durable ledger fail-closed unresolved/atomic admission + summary-reserve 33 + whole-run 10 passed (logbook 080). Real latency/token accounting is UNVERIFIED and OPEN (DEBT-021 / RISK-021); live concurrency/retry unobserved (DEBT-036)."
    status: Implemented
    source_files:
      - tradingagents/debate/budget.py
      - tradingagents/debate/config.py
      - tradingagents/debate/usage_ledger.py
      - tradingagents/debate/usage_capture.py
      - tradingagents/debate/researcher_accounting.py
      - tradingagents/agents/researchers/bull_researcher.py
      - tradingagents/agents/researchers/bear_researcher.py
      - tradingagents/graph/setup.py
      - tradingagents/graph/conditional_logic.py
      - tradingagents/graph/trading_graph.py
    design_artifacts:
