- id: NFR-VER-002
  type: governance
  title: Executed verification instead of simulated results
  statement: 'Claims about the delivered system are produced by commands that were
    actually executed in the repository, not by reading files, inferring from structure
    or fabricating plausible output. When a tool needed for execution is unavailable,
    the agent establishes that fact by an actual call and recovers execution capability,
    or reports the limitation, rather than substituting a simulated result. Delegated
    reviewers are read-only and can fail a candidate.

    '
  priority: must
  priority_tradeoff: 'The failure mode is silent: a simulated result looks exactly
    like an executed one, so only an execution trail distinguishes them.'
  priority_rationale: This is the most repeated human correction in the recorded sessions;
    a verification claim that was simulated is indistinguishable from a fabricated
    result.
  tradeoff:
    decision: Prove execution with an actual call, or report the limitation explicitly.
    rejected_or_deferred: Static reading, inference or simulated output presented
      as verification.
    why: 'The failure mode is silent: a simulated result looks exactly like an executed
      one, so only an execution trail distinguishes them.'
  origin: governance
  origin_detail: governance
  sources:
  - kind: repository
    reference: test/conftest.py
    locator: NFR-VER-002 personal source_files
    rationale: Preserved personal retrospective requirement provenance.
  - kind: repository
    reference: scripts/c3_verify_final_freeze.py
    locator: NFR-VER-002 personal source_files
    rationale: Preserved personal retrospective requirement provenance.
