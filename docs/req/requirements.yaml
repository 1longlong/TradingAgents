- id: FR-ANL-004
  type: quality
  title: Agent and system-component usage attribution
  statement: 'Attribute every provider usage event to either an agent or a named system
    component. The pre-graph reflector, which calls the provider outside every graph
    node, is recorded as the system component pre_graph_reflector and never disguised
    as an analyst. An event with no attribution scope is recorded as none, and a none
    attribution invalidates the measured run.

    '
  priority: must
  priority_tradeoff: Guessing an owner fabricates attribution and hides the reflector
    call's real cost.
  priority_rationale: An unattributed usage event makes a measured run unmeasurable,
    so attribution gates every cost claim.
  tradeoff:
