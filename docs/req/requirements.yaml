  - id: REQ-WEB-005
    type: functional
    statement: >-
      The WebUI shall allow cancelling an active analysis with CLI-equivalent
      semantics: stop execution, write no decision-log entry, clear no
      checkpoint, preserve artifacts already written, and leave the existing
      checkpoint resumable when checkpointing was enabled.
    priority: must
    priority_tradeoff: >-
      Long analyses need a stop control, and a stop that silently records a
      decision would corrupt the memory log. The cost is a cancellation state
      machine and explicit partial-artifact handling.
    origin: extension
    sources:
      - kind: human_decision
        reference: Requirements discussion in the current session, 2026-11-05
        locator: Batch 2 cancellation selection and Batch 4 cancellation confirmation
        rationale: The user authorized cancellation with CLI-equivalent semantics.
      - kind: repository
        reference: src/cli/main.py
        locator: run_analysis() stream loop, record_decision(), clear_checkpoint_on_success()
        rationale: Defines what the CLI does and does not do when interrupted.
    status: draft
    architecture_refs:
