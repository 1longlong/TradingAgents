    fabricating a rating. A SCORED traceability result requires exactly four non-null
    scores, one for each TRACEABILITY_DIMENSIONS dimension, in that exact positional
    order; a missing, extra, null, duplicate, or reordered dimension set fails closed
    rather than silently mis-reporting a rating. The Phase 4A comparison output and
    reports must be labeled clearly as deterministic offline scripted-fixture results,
    not live-provider measurements, and must state that no production thresholds were
    tuned and that human score-based traceability is pending a human.

