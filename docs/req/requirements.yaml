  - id: REQ-WEB-029
    type: invariant
    statement: >-
      The WebUI shall never allow concurrent writes to the decision log,
      checkpoints, or shared core configuration, and cancellation shall not
      write a decision or clear a checkpoint.
    priority: must
    priority_tradeoff: >-
      The baseline memory writer and global configuration are not proven safe
      under concurrency. A single active run and explicit cancellation
      semantics are the minimum safe boundary.
    origin: baseline
    sources:
      - kind: repository
        reference: src/tradingagents/agents/utils/memory.py
        locator: store_decision(), update_with_outcome(), batch_update_with_outcomes()
        rationale: Shows read-modify-write behavior and its concurrency limit.
