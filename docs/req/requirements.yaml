- id: FR-OBS-004
  type: cost
  title: Invocation-level settlement of Single-Pass attempts
  statement: 'Instrument every actual Single-Pass model invocation at the transport
    boundary so that N outbound attempts produce exactly N invocation records, with
    no nested or double settlement, provider usage preserved when it is available,
    and a missing usage field left missing rather than set to zero. A budget denial
    propagates without issuing an unauthorised fallback request.

    '
