  # ---- Phase 4A offline baseline comparison (NFR-CMP-*) ----
  - id: NFR-CMP-001
    type: NonFunctional
    title: Deterministic offline baseline comparison
    description: >
      Provide a pure, LLM-free, network-free comparison model/runner that
      contrasts the legacy fixed-round debate-termination baseline with the
      dynamic policy over identical scripted case identity (ticker, target_date,
      evidence_snapshot_id, policy_version) and identical scripted Bull/Bear
      turn sequences. Both strategies are replayed over the same evidence
      snapshot; any identity mismatch, missing strategy partner, or duplicate
      result fails closed with PairingError so the two strategies are never
      compared on an unequal footing. No live provider, wall clock, or paid API
      is involved. A replayed run records the ACTUAL deterministic stop reason
      (e.g. no_new_evidence, budget_exhausted, max_rounds_reached) and must
      distinguish a genuinely early-stopped dynamic run from a scripted input
      that simply ran out of rounds (input_exhausted): the latter is never a
      dynamic-policy early stop and is never mislabelled as one.
    priority: Must
    status: Implemented
    source_files:
      - tradingagents/comparison/runner.py
      - tradingagents/comparison/schemas.py
      - tradingagents/comparison/fixtures.py
      - scripts/run_phase4a_comparison.py
    design_artifacts:
      - docs/architecture/adr/003-phase4a-offline-comparison.md
      - docs/architecture/invariants.md
    tests:
      - tests/test_comparison_runner.py
      - tests/test_comparison_schemas.py
    verification_evidence:
      - "tests/test_comparison_runner.py + tests/test_comparison_schemas.py: 90 passed (current tree; correction round 73 logbook 054; narrow fail-closed correction 90 logbook 055)."
      - "scripts/run_phase4a_comparison.py: 3 scripted cases written to evaluation-output/ (logbook 049); stop_reason now preserved (no_new_evidence / budget_exhausted / max_rounds_reached) in results, JSON/aggregates, and Markdown (correction round, logbook 054)."
      - "Narrow fail-closed correction: CaseResult.__post_init__ rejects a contradictory strategy/early_stopped/stop_reason combination (FIXED is never early-stopped; an early-stopped DYNAMIC result must carry a genuine _DYNAMIC_STOP_REASONS reason) so an inconsistent result can never reach the aggregate/report (logbook 055)."
      - "Human review decision: Phase 4A approved with limitations (WANG Yiwen 60536848, 2026-10-23; logbook 056; docs/review-memo.md). Subject to the four recorded limitations (offline-only, cache baselines remain, traceability pending, no production threshold tuning)."
    owner: 60536848-WANG-Yiwen

  - id: NFR-CMP-002
    type: NonFunctional
    title: Machine-readable measured-vs-estimated comparison metrics
    description: >
      Comparison metrics must be derived deterministically from explicit
      numerators and denominators with documented zero-denominator behavior
      (returns None, never raises or fabricates). Measured provider-reported
      values are separated from deterministic char-based estimates via an
      explicit estimated flag; evidence-citation coverage is derived from valid
      cited evidence IDs (known, High/Medium, on-or-before target, linked to a
      claim) over the snapshot's eligible IDs; false-strong-conclusion rate is
      computed from an explicit strong_conclusion flag plus the gate/quality
      outcome, never inferred from prose; and aggregate sums/rates must be
      derived deterministically and reproducible across runs. Tool-call counts
      (per case and aggregate) and the estimated/measured usage provenance must
      be preserved in the aggregate and surfaced in both the JSON and Markdown
      reports so an estimated value is never presented as measured.
    priority: Must
    status: Implemented
    source_files:
      - tradingagents/comparison/metric_formulas.py
      - tradingagents/comparison/schemas.py
      - tradingagents/comparison/runner.py
      - tradingagents/comparison/report.py
    design_artifacts:
      - docs/architecture/adr/003-phase4a-offline-comparison.md
    tests:
