[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.5.0"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "langchain-core>=0.3.81",
    "langchain-anthropic>=0.3.15",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "typing-extensions>=4.14.0",
    "yfinance>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
    "PyYAML>=6.0,<7",
    "jsonschema>=4.23,<5",
    "json5>=0.9,<1",
    "mypy>=1.11,<3",
    "pip-audit>=2.9,<3",
    "bandit>=1.8,<2",
    "pytest-socket>=0.7,<1",
    "tomli>=2.0; python_version < '3.11'",
    "httpx>=0.27,<1",
]
# Read-only WebUI (Iteration 1). Optional so the core install stays lean:
# pip install "tradingagents[web]".
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "tradingagents[bedrock]".
bedrock = [
    "langchain-aws>=1.5.0",
]

[project.scripts]
tradingagents = "cli.main:app"
tradingagents-web = "tradingagents_web.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tradingagents*", "cli*", "trading", "safety"]

[tool.setuptools.package-data]
cli = ["static/*"]
tradingagents_web = ["static/**"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["results"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports
"token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/logs/audit/ast_proof.py" = ["B905", "SIM102"]
"token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/logs/audit/check_env_delivery.py" = ["E402", "F401", "I001"]
"token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/logs/audit/check_guard.py" = ["E402", "I001"]
"token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/logs/audit/env_credential_check.py" = ["E741", "F401"]
"token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/logs/audit/independent_check.py" = ["B007", "C408", "E702", "F541"]
"token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/logs/audit/pit_check.py" = ["E402", "E741", "I001"]
"token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/logs/audit/probe_blast_radius.py" = ["E402"]
"token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/logs/audit/probe_harness_delivery.py" = ["E402"]
"token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/logs/audit/probe_hash_scope.py" = ["E401", "E702", "F401", "I001"]
"token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/logs/audit/quantify.py" = ["E402", "E741", "F401", "I001"]
"token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/logs/audit/runtime_proof.py" = ["E402", "E741", "F401", "I001"]
"token_benchmarks/live_pilot_2x2/cand01_batch_16run_v2/logs/audit/runtime_proof2.py" = ["E402", "E741", "I001", "SIM105"]

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor re-exports in interface.py) instead of one statement per name.
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[tool.tradingagents.ci]
# Runtime evaluation must be approved on the PR base before a prompt/model change.
# ADR-030 / NFR-GOV-002: relevant changes need authentic candidate observations.
[tool.tradingagents.ci.semantic_evaluation]
evaluator = "test/semantic_evaluator.py"
dataset = "test/semantic_cases.json"
observations = "test/semantic_observations.json"
[tool.tradingagents.ci.semantic_evaluation.thresholds.task_accuracy]
comparison = "eq"
threshold = 1.0
[tool.tradingagents.ci.semantic_evaluation.thresholds.fact_fidelity]
comparison = "eq"
threshold = 1.0
[tool.tradingagents.ci.semantic_evaluation.thresholds.safety_escapes]
comparison = "eq"
threshold = 0

# ADR-029 / NFR-GOV-001: base-owned human GitHub database IDs.
[tool.tradingagents.ci.test_approval]
version = 1
reviewer_ids = [66710554]
